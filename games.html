<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duels review · GeoGuessr Atlas</title>
<style>
  :root {
    --ocean: #12283a; --panel: #0e2130; --land: #264457; --line: #3b5a6d;
    --ink: #e6eef2; --muted: #8ea6b4; --sign: #f2c94c; --ok: #7cc7b4; --mid: #e9cf6a; --ko: #ef7d6b;
    --font: Bahnschrift, "DIN Alternate", "DIN 2014", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--ocean); color: var(--ink); font-family: var(--font); }
  body { padding: 16px 16px 60px; }
  .wrap { max-width: 1150px; margin: 0 auto; }
  a { color: var(--ok); }
  button, select { font: inherit; color: inherit; }
  button { background: var(--land); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--ok); }
  button.on { background: var(--sign); color: #1a1a1a; border-color: var(--sign); }
  :focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  header h1 { margin: 0; font-size: 25px; }
  header .right { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  section h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  section h2 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .grp .lbl { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .grp button { padding: 4px 9px; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 400; font-size: 12px; border-top: 0; cursor: pointer; user-select: none; }
  th.on { color: var(--sign); }
  th:first-child, td:first-child { text-align: left; }
  td.l { text-align: left; white-space: normal; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #16303f; }
  .pct { font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .two > * { min-width: 0; }
  section h2 .r { white-space: normal; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips a, .chips span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; text-decoration: none; color: var(--ink); }
  .chips a:hover { border-color: var(--sign); color: var(--sign); }
  .ok { color: var(--ok); } .ko { color: var(--ko); } .mid { color: var(--mid); }
  .rd td { vertical-align: top; }
  .rd small { display: block; color: var(--muted); font-size: 12px; white-space: normal; }
  .empty { padding: 24px 10px; color: var(--muted); }
  .empty code { color: var(--ink); }
  #back { margin-bottom: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .tabs a.on { background: var(--sign); color: #1a1a1a; border-color: var(--sign); }
  .hp { display: inline-block; width: 60px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-left: 4px; }
  .hp i { display: block; height: 100%; }
  .gnav { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #mapbox { position: relative; }
  #map { width: 100%; height: min(62vh, 560px); display: block; background: #0b1c29; border-radius: 8px; touch-action: none; cursor: grab; }
  #map path.reg { stroke: #0b1c29; stroke-width: var(--sw, .05); }
  #map path.reg.none { fill: #23394a; }
  #map circle { stroke: #0b1c29; stroke-width: var(--sw, .05); cursor: pointer; }
  #map circle.sel { stroke: #fff; }
  #map line { stroke-width: var(--lw, .08); pointer-events: none; }
  #map line.mate { stroke-dasharray: var(--da, .3) var(--da, .3); }
  #mapinfo { margin-top: 8px; font-size: 13px; min-height: 36px; }
  .wlegend { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .wlegend i { width: 16px; height: 9px; border-radius: 2px; display: inline-block; }
  .wlegend span { margin-right: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.mid { background: var(--mid); } .dot.ko { background: var(--ko); }
  tr.mrow { cursor: pointer; } tr.mrow:hover td { background: #16303f; }
  @media (max-width: 720px) {
    .two { grid-template-columns: 1fr; }
    .bar { display: none; }
    th, td { padding: 5px 6px; }
    .kpi b { font-size: 20px; }
  }
</style>

<body>
<div class="wrap">
  <header>
    <h1>Duels review</h1>
    <span class="muted" id="sub">your Duels and Team Duels, place by place · data stays in this browser</span>
    <span class="right"><button id="link" hidden title="Pick geo-review\review.json once: the page then reloads it by itself">Link review.json</button><button id="reload" hidden>Reload review.json</button><label><button id="imp">Import review.json</button><input type="file" id="file" accept=".json,application/json" hidden></label>
      <a href="./">Atlas</a><a href="daily.html">Review</a><a href="confusions.html">Mix-ups</a><a href="compare.html">Compare</a><a href="quiz.html">Quiz</a></span>
  </header>
  <div id="out"></div>
</div>

<script src="tgm-core.js"></script>
<script src="data.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const T = window.TGM, A = window.ATLAS || { apps: [] };
  const KEY = 'duels.review', PKEY = 'duels.reviewPrefs';     // not tgm.*: the games never go to the GitHub backup
  const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const nameOf = iso => (T && T.name(iso, 'en')) || iso;
  const flag = iso => (T && iso ? T.flag(iso) : '');
  const pct = (a, b) => b ? Math.round(a / b * 100) : null;
  const col = p => p == null ? 'var(--line)' : p < 30 ? 'var(--ko)' : p < 60 ? 'var(--mid)' : 'var(--ok)';
  const pctCell = (a, b) => { const p = pct(a, b); return p == null ? '<td class="muted">–</td>' : `<td class="pct">${p} %<span class="bar"><i style="width:${p}%;background:${col(p)}"></i></span></td>`; };

  let D = null, RAW = null;      // RAW: review.json as made by geo-review; D: the same seen by the player chosen in "I am"
  const SHARED = 'https://tgm-hub.github.io/geo-review-data/review.json';   // public copy pushed by geo-review\review.cmd
  const prefs = Object.assign({ mode: '', rated: '', move: '', days: 0, who: 'me', sort: 'lost', mate: '', lines: false, view: '' }, lsGet(PKEY, {}));
  const saveP = () => { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) {} };

  function load() {
    try { const t = localStorage.getItem(KEY); RAW = t ? JSON.parse(t) : null; } catch (e) { RAW = null; }
    if (RAW && RAW.v !== 1) RAW = null;
    D = RAW && viewAs(RAW, prefs.view);
  }
  // "I am" a teammate: only the games played with TGM, the teammate's guesses become "mine" and TGM becomes the mate
  // (TGM's rating is hidden: it is his own). Used by the teammate on his own browser, so his Atlas stats are his.
  function viewAs(d, id) {
    const gc = d.gameCols, rc = d.roundCols, M = gc.indexOf('mate');
    if (!id || id === d.me || !d.games.some(g => g[M] === id)) return d;
    const RB = gc.indexOf('ratingBefore'), RA = gc.indexOf('ratingAfter'), G0 = rc.indexOf('game'), ME = rc.indexOf('me'), MT = rc.indexOf('mate');
    const map = new Map(), games = [];
    d.games.forEach((g, i) => { if (g[M] === id) { const c = g.slice(); c[M] = d.me; c[RB] = c[RA] = null; map.set(i, games.length); games.push(c); } });
    const rounds = d.rounds.filter(r => map.has(r[G0])).map(r => { const c = r.slice(); c[G0] = map.get(r[G0]); c[ME] = r[MT]; c[MT] = r[ME]; return c; });
    return Object.assign({}, d, { me: id, games, rounds, users: Object.assign({ [d.me]: 'TGM' }, d.users) });
  }
  const iamFilter = () => {
    const n = {}, M = RAW.gameCols.indexOf('mate'), us = RAW.users || {};
    RAW.games.forEach(g => { if (g[M]) n[g[M]] = (n[g[M]] || 0) + 1; });
    const ms = Object.entries(n).filter(([, k]) => k >= 10).sort((a, b) => b[1] - a[1]);
    if (!ms.length) return '';
    return filt('<span title="Whose guesses count on this browser, Atlas Weak spots and Mix-ups included. Teammate: only the games played together.">I am</span>', 'view',
      [['', esc(us[RAW.me] || 'TGM')], ...ms.map(([id]) => [id, esc(us[id] || 'mate ' + id.slice(-4))])]);
  };
  // rounds as objects, with the guess taken into account (mine, or the team's best)
  function rows() {
    if (!D) return [];
    const gc = D.gameCols, rc = D.roundCols, qc = D.guessCols;
    const G = D.games.map(g => Object.fromEntries(gc.map((k, i) => [k, g[i]])));
    const last = G.length ? new Date(G[G.length - 1].started + 'Z').getTime() : 0;
    const out = [];
    for (const r of D.rounds) {
      const o = Object.fromEntries(rc.map((k, i) => [k, r[i]]));
      const g = G[o.game];
      if (prefs.mode && g.mode !== prefs.mode) continue;
      if (prefs.rated && String(g.rated) !== prefs.rated) continue;
      if (prefs.move && g.movement !== prefs.move) continue;
      if (prefs.days && new Date(g.started + 'Z').getTime() < last - prefs.days * 864e5) continue;
      if (prefs.mate === 'solo' ? g.mate : prefs.mate && g.mate !== prefs.mate) continue;
      const q = a => a ? Object.fromEntries(qc.map((k, i) => [k, a[i]])) : null;
      o.g = g; o.meG = q(o.me); o.mateG = q(o.mate);
      o.G = prefs.who === 'team' ? ([o.meG, o.mateG].filter(Boolean).find(x => x.teamBest) || o.meG || o.mateG) : o.meG;
      if (!o.G) continue;
      out.push(o);
    }
    return out;
  }
  function byCountry(list) {
    const m = {};
    for (const o of list) {
      const c = m[o.country] = m[o.country] || { iso: o.country, n: 0, okC: 0, nA: 0, okA: 0, nP: 0, okP: 0, km: 0, lost: 0, wrong: {} };
      c.n++; c.okC += o.G.okCountry ? 1 : 0; c.km += o.G.km || 0;
      if (o.G.okAdmin1 != null) { c.nA++; c.okA += o.G.okAdmin1 ? 1 : 0; }
      if (o.G.okPhone != null) { c.nP++; c.okP += o.G.okPhone ? 1 : 0; }
      if (o.damage < 0) c.lost -= o.damage;
      if (!o.G.okCountry && o.G.country) c.wrong[o.G.country] = (c.wrong[o.G.country] || 0) + 1;
    }
    return Object.values(m);
  }

  // Atlas: duels count like a trainer (Weak spots, Mix-ups, comparator, daily review) — all games, my own guesses
  function pushAtlas() {
    if (!T || !D) return;
    const saved = Object.assign({}, prefs); Object.assign(prefs, { mode: '', rated: '', move: '', days: 0, who: 'me' });
    const list = rows(); Object.assign(prefs, saved);
    const s = { seen: 0, correct: 0, practiced: 0, mastered: 0, weak: 0, byCountry: {} }, pairs = {};
    for (const o of list) {
      s.seen++; if (o.G.okCountry) s.correct++;
      const b = s.byCountry[o.country] = s.byCountry[o.country] || { seen: 0, correct: 0, practiced: 1, mastered: 0, weak: 0 };
      b.seen++; if (o.G.okCountry) b.correct++;
      if (!o.G.okCountry && o.G.country) { const k = o.country + '|' + o.G.country; pairs[k] = (pairs[k] || 0) + 1; }
    }
    s.practiced = Object.keys(s.byCountry).length;
    T.stats.write('duels', s);
    // per-country summary for the daily review: region accuracy, HP lost, weakest regions
    const sum = {};
    for (const o of list) {
      const c = sum[o.country] = sum[o.country] || { n: 0, nA: 0, okA: 0, lost: 0, r: {} };
      c.n++; if (o.damage < 0) c.lost -= o.damage;
      if (o.G.okAdmin1 != null) { c.nA++; c.okA += o.G.okAdmin1 ? 1 : 0; }
      if (o.admin1) { const r = c.r[o.admin1] = c.r[o.admin1] || [0, 0, 0]; r[0]++; r[1] += o.G.okAdmin1 ? 1 : 0; if (o.damage < 0) r[2] -= o.damage; }
    }
    for (const c of Object.values(sum)) {
      c.weak = Object.entries(c.r).filter(([, r]) => r[0] >= 2 && r[1] / r[0] < 0.5).sort((a, b) => b[1][2] - a[1][2]).slice(0, 3).map(([k, r]) => [k, ...r]);
      delete c.r;
    }
    try { localStorage.setItem('tgm.duels.summary', JSON.stringify({ made: D.made, countries: sum })); } catch (e) {}
    if (T.confusions) T.confusions.seed('duels', Object.entries(pairs).map(([k, n]) => [...k.split('|'), n]));
  }

  // Teammates: nicknames looked up by geo-review (users), games counted over the whole import
  const nick = id => (D.users || {})[id] || 'mate ' + String(id).slice(-4);
  function mates() {
    const n = {};
    D.games.forEach(g => { const m = g[D.gameCols.indexOf('mate')]; if (m) n[m] = (n[m] || 0) + 1; });
    return Object.entries(n).sort((a, b) => b[1] - a[1]);
  }
  const mateFilter = () => {
    const ms = mates();
    if (!ms.length) return '';
    return filt('Teammate', 'mate', [['', 'All'], ['solo', 'Solo duels'], ...ms.filter(([, n]) => n >= 3).map(([id, n]) => [id, `${esc(nick(id))} <span class="muted">${n}</span>`])]);
  };
  function mateTable() {
    const saved = prefs.mate; prefs.mate = '';
    const list = rows(); prefs.mate = saved;
    const m = {};
    for (const o of list) {
      const id = o.g.mate || 'solo', x = m[id] = m[id] || { games: new Set(), won: new Set(), n: 0, me: 0, mt: 0, meA: 0, mtA: 0, nA: 0, mine: 0, km: 0 };
      x.games.add(o.game); if (o.g.won) x.won.add(o.game);
      x.n++; x.me += o.meG && o.meG.okCountry ? 1 : 0; x.mt += o.mateG && o.mateG.okCountry ? 1 : 0;
      if (o.meG && o.meG.okAdmin1 != null) { x.nA++; x.meA += o.meG.okAdmin1 ? 1 : 0; x.mtA += o.mateG && o.mateG.okAdmin1 ? 1 : 0; }
      if (o.meG && o.meG.teamBest) x.mine++;
    }
    const rowsH = Object.entries(m).sort((a, b) => b[1].games.size - a[1].games.size).map(([id, x]) => {
      const solo = id === 'solo';
      return `<tr class="mrow" data-m="${id}"><td>${solo ? 'Solo duels' : esc(nick(id))}</td><td>${x.games.size}</td>${pctCell(x.won.size, x.games.size)}<td>${x.n}</td>`
        + `${pctCell(x.me, x.n)}${solo ? '<td class="muted">–</td>' : pctCell(x.mt, x.n)}${pctCell(x.meA, x.nA)}${solo ? '<td class="muted">–</td>' : pctCell(x.mtA, x.nA)}`
        + `${solo ? '<td class="muted">–</td>' : pctCell(x.mine, x.n)}</tr>`;
    }).join('');
    return `<section><h2>By teammate <span class="r muted">click to filter · same filters except teammate</span></h2><div class="tw"><table>
      <tr><th>Teammate</th><th>Games</th><th>Won</th><th>Rounds</th><th>Country (me)</th><th>Country (mate)</th><th>Region (me)</th><th>Region (mate)</th><th>Team guess was mine</th></tr>${rowsH}</table></div></section>`;
  }

  const filt = (lbl, key, opts) => `<div class="grp" data-k="${key}"><span class="lbl">${lbl}</span>${opts.map(([v, t]) =>
    `<button data-v="${v}" class="${String(prefs[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;

  // ---------------------------------------------------------------- map (admin-1 shapes from City Placer, same site)
  let mapData = null;
  const TOPO = {};
  const decode = (topo, obj) => {
    const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
    const arcs = topo.arcs.map(a => { let x = 0, y = 0; return a.map(([dx, dy]) => { x += dx; y += dy; return [x * sx + tx, y * sy + ty]; }); });
    const ring = idx => { const pts = []; idx.forEach(k => { const seg = k >= 0 ? arcs[k] : arcs[~k].slice().reverse(); pts.push(...(pts.length ? seg.slice(1) : seg)); }); return pts; };
    return topo.objects[obj].geometries.map(g => ({ name: (g.properties || {}).name,
      polys: g.type === 'Polygon' ? [g.arcs.map(ring)] : g.type === 'MultiPolygon' ? g.arcs.map(p => p.map(ring)) : [] }));
  };
  async function drawMap() {
    const svg = $('map'), { iso, list, regs } = mapData;
    let feats = [];
    try {
      if (!(iso in TOPO)) { const r = await fetch(`../city-placer/admin1/${iso}.json`); TOPO[iso] = r.ok ? await r.json() : null; }
      if (TOPO[iso]) feats = decode(TOPO[iso].topo, 'sub');
    } catch (e) { TOPO[iso] = null; }
    if (svg !== $('map')) return;                      // re-rendered meanwhile
    // equirectangular around the country's middle latitude: x = lng · cos(lat0), y = −lat
    const lats = list.map(o => o.lat), lngs = list.map(o => o.lng);
    feats.forEach(f => f.polys.forEach(p => p[0].forEach(([x, y]) => { lngs.push(x); lats.push(y); })));
    let x0 = Math.min(...lngs), x1 = Math.max(...lngs);
    const wrap = x1 - x0 > 180;                          // Russia, US (Aleutians), Fiji…: carry the western longitudes past 180°
    const W = lng => wrap && lng < 0 ? lng + 360 : lng;
    x0 = Math.min(...lngs.map(W)); x1 = Math.max(...lngs.map(W));
    const y0 = Math.min(...lats), y1 = Math.max(...lats);
    const k = Math.cos((y0 + y1) / 2 * Math.PI / 180);
    const P = (lng, lat) => [W(lng) * k, -lat];
    const pad = Math.max((x1 - x0) * k, y1 - y0) * 0.05;
    let vb = { x: x0 * k - pad, y: -y1 - pad, w: (x1 - x0) * k + 2 * pad, h: (y1 - y0) + 2 * pad };
    const fillOf = name => { const r = regs[name]; if (!r || !r.nn) return null; const p = r.ok / r.nn; return ['#d9614c', '#e8995a', '#e9cf6a', '#9fcb7a', '#5fae7e'][Math.min(4, Math.floor(p * 5))]; };
    const pathOf = polys => polys.map(p => p.map(r => 'M' + r.map(([x, y]) => P(x, y).map(v => v.toFixed(3)).join(',')).join('L') + 'Z').join('')).join('');
    let html = feats.map(f => { const c = fillOf(f.name); return `<path class="reg${c ? '' : ' none'}" ${c ? `style="fill:${c}"` : ''} d="${pathOf(f.polys)}"><title>${esc(f.name)}${regs[f.name] ? ` · ${regs[f.name].n} round(s), ${pct(regs[f.name].ok, regs[f.name].nn) ?? '–'} % right` : ''}</title></path>`; }).join('');
    html += '<g id="glines"></g>';
    html += list.map((o, i) => { const [x, y] = P(o.lng, o.lat), c = o.G.okCountry ? (o.G.okAdmin1 ? 'var(--ok)' : 'var(--mid)') : 'var(--ko)';
      return `<circle data-i="${i}" cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r="1" style="fill:${c}"><title>${esc(o.g.started.slice(0, 10))} · ${esc(o.admin1 || '')} · ${Math.round(o.G.km)} km</title></circle>`; }).join('');
    svg.innerHTML = html;
    const lineG = svg.querySelector('#glines');
    const lineTo = (o, q, cls) => { if (!q) return ''; const [a, b] = P(o.lng, o.lat), [c, d] = P(q.lng, q.lat);
      return `<line class="${cls}" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${q.okCountry ? (q.okAdmin1 ? '#7cc7b4' : '#e9cf6a') : '#ef7d6b'}"/>`; };
    const showLines = sel => { lineG.innerHTML = (sel != null ? [list[sel]] : prefs.lines ? list : []).map(o => lineTo(o, o.meG, 'me') + lineTo(o, o.mateG, 'mate')).join(''); };
    const apply = () => {
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      const r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height);
      svg.style.setProperty('--sw', (0.8 * s).toFixed(4)); svg.style.setProperty('--lw', (1.6 * s).toFixed(4)); svg.style.setProperty('--da', (4 * s).toFixed(4));
      svg.querySelectorAll('circle').forEach(c => c.setAttribute('r', (c.classList.contains('sel') ? 6 : 4) * s));
    };
    showLines(null); apply();
    svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height);
      const mx = vb.x + (e.clientX - r.left) * s - (r.width * s - vb.w) / 2, my = vb.y + (e.clientY - r.top) * s - (r.height * s - vb.h) / 2, f = Math.exp(e.deltaY * 0.0015);
      vb = { x: mx - (mx - vb.x) * f, y: my - (my - vb.y) * f, w: vb.w * f, h: vb.h * f }; apply(); }, { passive: false });
    let drag = null;
    svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false }; });
    svg.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(dx, dy) > 4) drag.moved = true; if (!drag.moved) return;
      const r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height); vb = { ...drag.vb, x: drag.vb.x - dx * s, y: drag.vb.y - dy * s }; apply(); });
    svg.addEventListener('pointerup', e => {
      const moved = drag && drag.moved; drag = null; if (moved) return;
      const c = e.target.closest && e.target.closest('circle');
      svg.querySelectorAll('circle.sel').forEach(x => x.classList.remove('sel'));
      if (!c) { showLines(null); apply(); return; }
      c.classList.add('sel'); svg.appendChild(c);
      const i = +c.dataset.i, o = list[i]; showLines(i); apply();
      const q = (x, who) => x ? `${who}: ${x.okCountry ? '' : flag(x.country) + ' '}${esc(x.admin1 || x.country || '?')}, ${Math.round(x.km)} km${x.teamBest ? ' ★' : ''}` : '';
      $('mapinfo').innerHTML = `<b>${esc(o.admin1 || '?')}</b>${o.city ? ' · ' + esc(o.city) : ''}${o.phone ? ' · ' + esc(o.phone) : ''} · ${esc(o.g.started.slice(0, 10))} r${o.n}`
        + ` · <a href="${svLink(o)}" target="_blank" rel="noopener">Street View ↗</a><br>${[q(o.meG, 'You'), o.g.mate ? q(o.mateG, esc(nick(o.g.mate))) : ''].filter(Boolean).join(' · ')}`
        + ` · <span class="${o.damage < 0 ? 'ko' : 'ok'}">${o.damage > 0 ? '+' : ''}${(o.damage || 0).toLocaleString('en-GB')} HP</span>`;
    });
    $('lines').onchange = e => { prefs.lines = e.target.checked; saveP(); showLines(null); apply(); };
    if (window.__mapResize) removeEventListener('resize', window.__mapResize);
    window.__mapResize = apply; addEventListener('resize', apply);
  }

  function render() {
    if (!D) {
      $('out').innerHTML = `<section class="empty"><p>No games imported on this browser yet.</p>
        <p>The page loads the shared <code>review.json</code> from GitHub by itself (<code>TGM-hub/geo-review-data</code>): if nothing shows, it is not online yet.</p>
        <p>On TGM's PC, in <code>geo-review</code>: <code>fetch.cmd</code> (gets the new games and places them), then <code>review.cmd</code>
        (writes <code>review.json</code>, pushes it to GitHub after a yes, opens this page). <b>Link review.json</b> or <b>Import</b> still work offline.</p>
        <p class="muted">Only per-country totals feed the Atlas Weak spots and Mix-ups of this browser.</p></section>`;
      return;
    }
    $('sub').textContent = `${D.games.length} games, ${D.rounds.length} rounds · data of ${new Date(D.made).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}${D !== RAW ? ' · seen as ' + nick(D.me) + ', games with TGM only' : ''}`;
    const h = decodeURIComponent(location.hash.slice(1));
    const iso = h.toUpperCase();
    const tab = /^g\//.test(h) || h === 'games' ? 'games' : h === 'regions' ? 'regions' : 'countries';
    const list = rows();
    let html = `<section class="filters">`
      + filt('Mode', 'mode', [['', 'All'], ['TeamDuels', 'Team Duels'], ['Duels', 'Duels']])
      + filt('', 'rated', [['', 'All'], ['1', 'Ranked'], ['0', 'Unranked']])
      + filt('', 'move', [['', 'All'], ['Move', 'Move'], ['NM', 'NM'], ['NMPZ', 'NMPZ']])
      + filt('Period', 'days', [[0, 'All'], [30, '30 d'], [7, '7 d']])
      + iamFilter() + filt('Guess', 'who', [['me', 'Mine'], ['team', "Team's best"]]) + mateFilter() + `</section>`;
    const tabs = `<nav class="tabs"><a href="#" class="${tab === 'countries' ? 'on' : ''}">Countries</a><a href="#regions" class="${tab === 'regions' ? 'on' : ''}">Hardest regions</a><a href="#games" class="${tab === 'games' ? 'on' : ''}">Games</a></nav>`;
    html = tabs + html;
    html += /^g\//.test(h) ? gameView(h.slice(2)) : h === 'games' ? gamesList(list) : h === 'regions' ? hardest(list)
      : /^[A-Z]{2}$/.test(iso) ? countryView(iso, list) : overview(list);
    $('out').innerHTML = html;
    $('out').querySelectorAll('.grp button').forEach(b => b.onclick = () => {
      const k = b.parentElement.dataset.k; prefs[k] = k === 'days' ? +b.dataset.v : b.dataset.v;
      if (k === 'view') { prefs.mate = ''; saveP(); load(); pushAtlas(); render(); return; }
      saveP(); render();
    });
    $('out').querySelectorAll('tr.row').forEach(tr => tr.onclick = () => { location.hash = tr.dataset.iso.toLowerCase(); });
    $('out').querySelectorAll('tr.grow').forEach(tr => tr.onclick = () => { location.hash = 'g/' + tr.dataset.g; });
    $('out').querySelectorAll('[data-more]').forEach(b => b.onclick = () => { gamesShown += 100; render(); });
    $('out').querySelectorAll('th[data-s]').forEach(th => th.onclick = () => { prefs.sort = th.dataset.s; saveP(); render(); });
    const bk = $('back'); if (bk) bk.onclick = () => { history.pushState(null, '', location.pathname); render(); };
    $('out').querySelectorAll('tr.mrow').forEach(tr => tr.onclick = () => { prefs.mate = prefs.mate === tr.dataset.m ? '' : tr.dataset.m; saveP(); render(); });
    if ($('map')) drawMap();
  }

  function kpis(list) {
    const c = byCountry(list), sum = k => c.reduce((a, x) => a + x[k], 0);
    const kms = list.map(o => o.G.km).sort((a, b) => a - b), med = kms.length ? kms[kms.length >> 1] : 0;
    return `<section class="kpis">
      <div class="kpi"><b>${list.length}</b><span>rounds</span></div>
      <div class="kpi"><b>${pct(sum('okC'), sum('n')) ?? '–'} %</b><span>right country</span></div>
      <div class="kpi"><b>${pct(sum('okA'), sum('nA')) ?? '–'} %</b><span>right region (state, province…)</span></div>
      <div class="kpi"><b>${pct(sum('okP'), sum('nP')) ?? '–'} %</b><span>right area code (${sum('nP')} rounds with codes)</span></div>
      <div class="kpi"><b>${Math.round(med)} km</b><span>median distance</span></div>
      <div class="kpi"><b>${sum('lost').toLocaleString('en-GB')}</b><span>HP lost (team)</span></div></section>`;
  }

  function overview(list) {
    const c = byCountry(list).filter(x => x.iso);
    const S = { lost: x => -x.lost, n: x => -x.n, c: x => x.okC / x.n, a: x => x.nA ? x.okA / x.nA : 2, p: x => x.nP ? x.okP / x.nP : 2, km: x => -x.km / x.n, name: x => nameOf(x.iso) };
    const f = S[prefs.sort] || S.lost;
    c.sort((a, b) => { const x = f(a), y = f(b); return typeof x === 'string' ? x.localeCompare(y) : x - y || b.n - a.n; });
    const th = (k, t) => `<th data-s="${k}" class="${prefs.sort === k ? 'on' : ''}">${t}</th>`;
    return kpis(list) + mateTable() + `<section><h2>By country <span class="r muted">click a country for its regions and rounds · click a header to sort</span></h2><div class="tw"><table>
      <tr>${th('name', 'Country')}${th('n', 'Rounds')}${th('c', 'Country')}${th('a', 'Region')}${th('p', 'Area code')}${th('km', 'Avg km')}${th('lost', 'HP lost')}<th>Taken for</th></tr>`
      + c.map(x => {
        const w = Object.entries(x.wrong).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, n]) => `${flag(k)} ${k} ${n}`).join(' · ');
        return `<tr class="row" data-iso="${x.iso}"><td>${flag(x.iso)} ${esc(nameOf(x.iso))}</td><td>${x.n}</td>${pctCell(x.okC, x.n)}${pctCell(x.okA, x.nA)}${pctCell(x.okP, x.nP)}`
          + `<td>${Math.round(x.km / x.n)}</td><td>${x.lost.toLocaleString('en-GB')}</td><td class="l muted">${w}</td></tr>`;
      }).join('') + `</table></div></section>`;
  }

  const appLink = (a, iso) => a.deeplink ? a.deeplink.replace('{iso}', iso.toLowerCase()) : a.url;
  const svLink = o => {
    let id = o.pano || '';
    if (/^[0-9A-F]+$/i.test(id) && id.length % 2 === 0) id = id.match(/../g).map(h => String.fromCharCode(parseInt(h, 16))).join('');   // GeoGuessr hex-encodes the pano id
    return id ? `https://www.google.com/maps/@?api=1&map_action=pano&pano=${encodeURIComponent(id)}&heading=${Math.round(o.heading || 0)}`
      : `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${o.lat},${o.lng}`;
  };
  // ---------------------------------------------------------------- hardest regions: where we know the country but not the region
  function hardest(list) {
    const m = {};
    for (const o of list) {
      if (!o.admin1) continue;
      const k = o.country + '|' + o.admin1, r = m[k] = m[k] || { iso: o.country, name: o.admin1, n: 0, okC: 0, nn: 0, ok: 0, km: 0, lost: 0 };
      r.n++; r.km += o.G.km || 0; if (o.damage < 0) r.lost -= o.damage; if (o.G.okCountry) r.okC++;
      if (o.G.okAdmin1 != null) { r.nn++; r.ok += o.G.okAdmin1 ? 1 : 0; }
    }
    const S = { lost: x => -x.lost, miss: x => x.nn ? x.ok / x.nn - x.okC / x.n : 2, km: x => -x.km / x.n, n: x => -x.n };
    const sort = S[prefs.rsort] ? prefs.rsort : 'lost';
    const rs = Object.values(m).filter(x => x.n >= 3).sort((a, b) => S[sort](a) - S[sort](b) || b.n - a.n).slice(0, 60);
    const th = (k, t) => `<th data-rs="${k}" class="${sort === k ? 'on' : ''}">${t}</th>`;
    setTimeout(() => $('out').querySelectorAll('th[data-rs]').forEach(t => t.onclick = () => { prefs.rsort = t.dataset.rs; saveP(); render(); }));
    return kpis(list) + `<section><h2>Hardest regions <span class="r muted">3+ rounds · “vibe gap”: right country, wrong region (landscape, architecture, no readable clue) · click for the country</span></h2><div class="tw"><table>
      <tr><th>Region</th><th>Country</th>${th('n', 'Rounds')}<th>Country right</th><th>Region right</th>${th('miss', 'Vibe gap')}${th('km', 'Avg km')}${th('lost', 'HP lost')}</tr>`
      + rs.map(x => { const gap = x.nn ? Math.round((x.okC / x.n - x.ok / x.nn) * 100) : null;
        return `<tr class="row" data-iso="${x.iso}"><td class="l">${esc(x.name)}</td><td>${flag(x.iso)} ${x.iso}</td><td>${x.n}</td>${pctCell(x.okC, x.n)}${pctCell(x.ok, x.nn)}`
          + `<td class="${gap >= 60 ? 'ko' : gap >= 30 ? 'mid' : 'muted'}">${gap == null ? '–' : gap + ' pts'}</td><td>${Math.round(x.km / x.n)}</td><td>${x.lost.toLocaleString('en-GB')}</td></tr>`; }).join('')
      + `</table></div></section>`;
  }

  // ---------------------------------------------------------------- games: list, then one game round by round
  let gamesShown = 100;
  const gameRounds = id => {
    const gc = D.gameCols, rc = D.roundCols, qc = D.guessCols, gi = D.games.findIndex(g => g[0] === id);
    if (gi < 0) return null;
    const g = Object.fromEntries(gc.map((k, i) => [k, D.games[gi][i]]));
    const q = a => a ? Object.fromEntries(qc.map((k, i) => [k, a[i]])) : null;
    const rs = D.rounds.filter(r => r[0] === gi).map(r => { const o = Object.fromEntries(rc.map((k, i) => [k, r[i]])); o.g = g; o.meG = q(o.me); o.mateG = q(o.mate); return o; })
      .sort((a, b) => a.n - b.n);
    return { g, gi, rs };
  };
  function gamesList(list) {
    const by = new Map();
    for (const o of list) {
      const x = by.get(o.g.id) || { g: o.g, n: 0, okC: 0, okA: 0, nA: 0, km: 0, lost: 0, countries: [] };
      x.n++; x.okC += o.G.okCountry ? 1 : 0; x.km += o.G.km || 0; if (o.damage < 0) x.lost -= o.damage;
      if (o.G.okAdmin1 != null) { x.nA++; x.okA += o.G.okAdmin1 ? 1 : 0; }
      x.countries.push(o.country); by.set(o.g.id, x);
    }
    const gs = [...by.values()].sort((a, b) => b.g.started.localeCompare(a.g.started));
    const won = gs.filter(x => x.g.won).length;
    return `<section><h2>Games <span class="r muted">${gs.length} games, ${won} won (${pct(won, gs.length) ?? '–'} %) · newest first · click for the rounds</span></h2><div class="tw"><table>
      <tr><th>Date</th><th>Mode</th><th>Map</th><th>Teammate</th><th>Result</th><th>Rating</th><th>Rounds</th><th>Country</th><th>Region</th><th>HP lost</th><th>Countries</th></tr>`
      + gs.slice(0, gamesShown).map(x => { const g = x.g, dr = g.ratingAfter != null && g.ratingBefore != null ? g.ratingAfter - g.ratingBefore : null;
        return `<tr class="grow" data-g="${g.id}" style="cursor:pointer"><td>${esc(g.started.replace('T', ' '))}</td><td>${g.mode === 'TeamDuels' ? 'Team' : 'Duel'} · ${esc(g.movement)}${g.rated ? '' : ' <span class="muted">unranked</span>'}</td>`
          + `<td class="l muted">${esc(g.map || '')}</td><td>${g.mate ? esc(nick(g.mate)) : '<span class="muted">–</span>'}</td>`
          + `<td class="${g.won ? 'ok' : 'ko'}">${g.won ? 'Won' : 'Lost'}</td><td class="${dr > 0 ? 'ok' : dr < 0 ? 'ko' : 'muted'}">${dr == null ? '–' : (dr > 0 ? '+' : '') + dr}</td>`
          + `<td>${x.n}</td>${pctCell(x.okC, x.n)}${pctCell(x.okA, x.nA)}<td>${x.lost.toLocaleString('en-GB')}</td><td class="l">${x.countries.map(flag).join('')}</td></tr>`; }).join('')
      + `</table></div>${gs.length > gamesShown ? `<p><button data-more>Show 100 more</button></p>` : ''}</section>`;
  }
  function gameView(id) {
    const G = gameRounds(id);
    if (!G) return `<section class="empty">Game not found in the imported file.</section>`;
    const { g, gi, rs } = G, dr = g.ratingAfter != null && g.ratingBefore != null ? g.ratingAfter - g.ratingBefore : null;
    const prev = D.games[gi - 1], next = D.games[gi + 1];
    const gq = (x, me) => x ? `<span class="${x.okCountry ? (x.okAdmin1 ? 'ok' : 'mid') : 'ko'}">${x.okCountry ? '' : flag(x.country) + ' '}${esc(x.admin1 || x.country || '?')}</span>`
      + `<small>${Math.round(x.km)} km · ${x.score} pts${x.teamBest ? ' · ★ team' : ''}</small>` : '<span class="muted">no guess</span>';
    const hp = (v, c) => v == null ? '' : `${v.toLocaleString('en-GB')}<span class="hp"><i style="width:${Math.max(0, Math.min(100, v / 60))}%;background:${c}"></i></span>`;
    let h = `<div class="gnav"><a href="#games">← All games</a>${prev ? `<a href="#g/${prev[0]}">← older</a>` : ''}${next ? `<a href="#g/${next[0]}">newer →</a>` : ''}</div>`;
    h += `<section><h2>${esc(g.started.replace('T', ' '))} · ${g.mode === 'TeamDuels' ? 'Team Duel' : 'Duel'} · ${esc(g.movement)}${g.rated ? ' · ranked' : ''}<span class="r muted">${esc(g.map || '')}</span></h2>`
      + `<p><b class="${g.won ? 'ok' : 'ko'}">${g.won ? 'Won' : 'Lost'}</b>${dr != null ? ` · rating ${g.ratingBefore} → ${g.ratingAfter} (<span class="${dr >= 0 ? 'ok' : 'ko'}">${dr > 0 ? '+' : ''}${dr}</span>)` : ''}`
      + `${g.mate ? ` · with <b>${esc(nick(g.mate))}</b>` : ''} · ${rs.length} rounds</p></section>`;
    h += `<section><h2>Rounds <span class="r muted">★ the team's guess · green right region, yellow right country, red wrong country</span></h2><div class="tw"><table class="rd">
      <tr><th>#</th><th>Where it was</th><th>Code · language</th><th>You</th>${g.mate ? `<th>${esc(nick(g.mate))}</th>` : ''}<th>Score</th><th>Damage</th><th>HP us · them</th></tr>`
      + rs.map(o => `<tr><td>${o.n}${o.multiplier > 1 ? `<small>×${o.multiplier}</small>` : ''}</td>`
        + `<td class="l"><a href="#${(o.country || '').toLowerCase()}">${flag(o.country)}</a> ${esc(o.admin1 || '?')}<small>${esc(o.city || '')}${o.kabupaten ? ' · ' + esc(o.kabupaten) : ''} · <a href="${svLink(o)}" target="_blank" rel="noopener">Street View ↗</a></small></td>`
        + `<td class="l">${esc(o.phone || '')}<small>${esc((o.langs || []).join(', '))}</small></td>`
        + `<td class="l">${gq(o.meG, true)}</td>${g.mate ? `<td class="l">${gq(o.mateG)}</td>` : ''}`
        + `<td>${o.myScore ?? '–'}<small>them ${o.oppScore ?? '–'}</small></td>`
        + `<td class="${o.damage < 0 ? 'ko' : o.damage > 0 ? 'ok' : 'muted'}">${o.damage > 0 ? '+' : ''}${(o.damage || 0).toLocaleString('en-GB')}</td>`
        + `<td>${hp(o.myHp, 'var(--ok)')}<small>${hp(o.oppHp, 'var(--ko)')}</small></td></tr>`).join('')
      + `</table></div></section>`;
    return h;
  }

  function countryView(iso, all) {
    const list = all.filter(o => o.country === iso);
    const c = byCountry(list)[0];
    let h = `<button id="back">← All countries</button>`;
    if (!c) return h + `<section class="empty">No round in ${esc(nameOf(iso))} with these filters.</section>`;
    h += `<section><h2>${flag(iso)} ${esc(nameOf(iso))}<span class="r"><a href="./#${iso.toLowerCase()}">Atlas page ↗</a></span></h2>${kpis(list).replace('<section class="kpis">', '<div class="kpis">').replace(/<\/section>$/, '</div>')}</section>`;
    // regions
    const reg = {};
    for (const o of list) {
      const k = o.admin1 || '(unknown)', r = reg[k] = reg[k] || { n: 0, ok: 0, nn: 0, km: 0, lost: 0, as: {} };
      r.n++; r.km += o.G.km || 0; if (o.damage < 0) r.lost -= o.damage;
      if (o.G.okAdmin1 != null) { r.nn++; r.ok += o.G.okAdmin1 ? 1 : 0; }
      if (!o.G.okAdmin1 && o.G.okCountry && o.G.admin1) r.as[o.G.admin1] = (r.as[o.G.admin1] || 0) + 1;
    }
    const regs = Object.entries(reg).sort((a, b) => b[1].lost - a[1].lost || b[1].n - a[1].n);
    h += `<div class="two"><section><h2>Regions <span class="r muted">where it was · you guessed instead</span></h2><div class="tw"><table><tr><th>Region</th><th>Rounds</th><th>Right</th><th>Avg km</th><th>HP lost</th><th>Guessed instead</th></tr>`
      + regs.map(([k, r]) => `<tr><td class="l">${esc(k)}</td><td>${r.n}</td>${pctCell(r.ok, r.nn)}<td>${Math.round(r.km / r.n)}</td><td>${r.lost.toLocaleString('en-GB')}</td>`
        + `<td class="l muted">${Object.entries(r.as).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([x, n]) => `${esc(x)} ${n}`).join(' · ')}</td></tr>`).join('') + `</table></div></section>`;
    // what to study
    const wrong = Object.entries(c.wrong).sort((a, b) => b[1] - a[1]);
    const tr = (A.apps || []).filter(a => a.countries.includes(iso) && (a.deeplink || a.scope === 'country') && a.status !== 'archived');
    const langs = [...new Set(list.flatMap(o => o.langs || []))];
    const codes = [...new Set(list.map(o => o.phone).filter(Boolean))];
    h += `<section><h2>Study</h2>`
      + (wrong.length ? `<p class="muted">Taken for</p><div class="chips">${wrong.map(([k, n]) => `<a href="compare.html#${iso.toLowerCase()}/${k.toLowerCase()}" title="Compare">${flag(k)} ${esc(nameOf(k))} ${n} ⚖</a>`).join('')}</div>` : '<p class="muted">Never taken for another country with these filters.</p>')
      + (tr.length ? `<p class="muted">Explore in the trainers</p><div class="chips">${tr.map(a => `<a href="${esc(appLink(a, iso))}" target="_blank" rel="noopener">${esc(a.name.en)} ↗</a>`).join('')}</div>` : '')
      + (T.plonkitUrl && T.plonkitUrl(iso) ? `<p class="muted">Guide</p><div class="chips"><a href="${esc(T.plonkitUrl(iso))}" target="_blank" rel="noopener">Plonk It ↗</a></div>` : '')
      + (codes.length ? `<p class="muted">Area codes met (${codes.length})</p><div class="chips">${codes.slice(0, 24).map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '')
      + (langs.length ? `<p class="muted">Languages met</p><div class="chips">${langs.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '')
      + `</section></div>`;
    // map: regions coloured by how often I find them, one dot per round, lines to the guesses on click
    h += `<section><h2>Map <span class="r muted"><label><input type="checkbox" id="lines" ${prefs.lines ? 'checked' : ''}> all guess lines</label> · wheel / drag to zoom · click a dot</span></h2>`
      + `<div class="wlegend"><i style="background:#d9614c"></i><i style="background:#e8995a"></i><i style="background:#e9cf6a"></i><i style="background:#9fcb7a"></i><i style="background:#5fae7e"></i><span>right region, 0 → 100 %</span>`
      + `<b class="dot ok"></b><span>right region</span><b class="dot mid"></b><span>right country</span><b class="dot ko"></b><span>wrong country</span></div>`
      + `<div id="mapbox"><svg id="map" data-iso="${iso}"></svg><div id="mapinfo" class="muted">Click a dot: where it was, your guess (solid) and your mate's (dashed).</div></div></section>`;
    mapData = { iso, list, regs: reg };
    // rounds, worst first
    const rs = list.slice().sort((a, b) => (a.damage || 0) - (b.damage || 0) || b.G.km - a.G.km).slice(0, 60);
    const g = (x, me) => x ? `<span class="${x.okCountry ? (x.okAdmin1 ? 'ok' : 'mid') : 'ko'}">${x.okCountry ? '' : flag(x.country) + ' '}${esc(x.admin1 || x.country || '?')}</span> <span class="muted">${Math.round(x.km)} km${me && x.teamBest ? ' ★' : ''}</span>` : '<span class="muted">no guess</span>';
    h += `<section><h2>Rounds <span class="r muted">worst first (HP, then distance) · ★ team's guess · green right region, yellow right country</span></h2><div class="tw"><table class="rd">
      <tr><th>Game</th><th>Where it was</th><th>Code · language</th><th>You</th><th>Mate</th><th>HP</th></tr>`
      + rs.map(o => `<tr><td>${esc(o.g.started.slice(0, 10))}<small>${esc(o.g.mode === 'TeamDuels' ? 'Team' : 'Duel')} · ${esc(o.g.movement)} · r${o.n}</small></td>`
        + `<td class="l">${esc(o.admin1 || '?')}${o.region ? ` <span class="muted">(${esc(o.region)})</span>` : ''}<small>${esc(o.city || '')}${o.kabupaten ? ' · ' + esc(o.kabupaten) : ''} · <a href="${svLink(o)}" target="_blank" rel="noopener">Street View ↗</a></small></td>`
        + `<td class="l">${esc(o.phone || '')}<small>${esc((o.langs || []).join(', '))}</small></td>`
        + `<td class="l">${g(o.meG, true)}</td><td class="l">${o.g.mode === 'TeamDuels' ? g(o.mateG) : ''}</td>`
        + `<td class="${o.damage < 0 ? 'ko' : o.damage > 0 ? 'ok' : 'muted'}">${o.damage > 0 ? '+' : ''}${(o.damage || 0).toLocaleString('en-GB')}</td></tr>`).join('')
      + `</table></div></section>`;
    return h;
  }

  async function importText(text, quiet) {
    const d = JSON.parse(text);
    if (d.v !== 1 || !Array.isArray(d.rounds)) throw new Error('not a review.json from geo-review');
    if (quiet && RAW && RAW.made >= d.made) return false;         // same or older than what this browser has
    localStorage.setItem(KEY, JSON.stringify(d));
    load(); pushAtlas(); render();
    return true;
  }
  $('imp').onclick = () => $('file').click();
  $('file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await importText(await f.text()); } catch (err) { alert('Import failed: ' + err.message); }
    e.target.value = '';
  };
  // Linked file (Edge / Chrome): pick geo-review\review.json once, the page re-reads it at each visit (File System Access API;
  // the handle stays in this browser's IndexedDB, the browser may ask once per session to allow reading it).
  const idb = (mode, fn) => new Promise((ok, ko) => { const r = indexedDB.open('duels', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onerror = () => ko(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('h', mode), q = fn(tx.objectStore('h')); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => ko(tx.error); }; });
  const getHandle = () => idb('readonly', st => st.get('review')).catch(() => null);
  async function readLinked(handle, ask) {
    let perm = await handle.queryPermission({ mode: 'read' });
    if (perm !== 'granted' && ask) perm = await handle.requestPermission({ mode: 'read' });
    if (perm !== 'granted') { $('reload').hidden = false; return; }
    $('reload').hidden = true;
    const f = await handle.getFile();
    const changed = await importText(await f.text(), true);
    $('sub').textContent += changed ? ' · reloaded from the linked file' : ' · linked file: up to date';
  }
  if ('showOpenFilePicker' in window) {
    $('link').hidden = false;
    $('link').onclick = async () => {
      try {
        const [h] = await showOpenFilePicker({ types: [{ description: 'review.json', accept: { 'application/json': ['.json'] } }] });
        await idb('readwrite', st => st.put(h, 'review'));
        $('link').textContent = 'Linked ✓'; await readLinked(h, true);
      } catch (err) { if (err.name !== 'AbortError') alert('Link failed: ' + err.message); }
    };
    $('reload').onclick = async () => { const h = await getHandle(); if (h) readLinked(h, true).catch(err => alert(err.message)); };
    getHandle().then(h => { if (h) { $('link').textContent = 'Linked ✓'; $('link').title = 'Linked to ' + h.name + ': click to pick another file'; return readLinked(h, false); } }).catch(() => {});
  }
  // Shared copy on GitHub (TGM-hub/geo-review-data, Pages): read at each visit, kept only if newer (works on the phone too)
  fetch(SHARED + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : null)
    .then(t => t ? importText(t, true) : false).then(ch => { if (ch) $('sub').textContent += ' · updated from GitHub'; }).catch(() => {});
  addEventListener('hashchange', render);
  load(); render();
})();
</script>
</body>
</html>
