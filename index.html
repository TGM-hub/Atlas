<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoGuessr Atlas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
  :root {
    --ocean: #12283a;
    --land: #2b4c60;
    --land-hover: #3a6076;
    --sign: #f2c94c;
    --sign-soft: #b8974a;
    --sea-glass: #7cc7b4;
    --ink: #e6eef2;
    --muted: #8ea6b4;
    --line: #3b5a6d;
    --panel: #0e2130;
    --inv-bg: #1a1a1a;
    --panel-w: clamp(340px, 28vw, 520px);
    --font: Bahnschrift, "DIN Alternate", "DIN 2014", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ocean); color: var(--ink); font-family: var(--font); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }

  #app {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr var(--panel-w);
    grid-template-rows: auto 1fr;
    padding: 16px 20px;
    gap: 14px 20px;
  }
  #app.board-mode #mapwrap, #app.board-mode #panel { display: none; }
  #app:not(.board-mode) #board { display: none; }

  /* --- En-tête --- */
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #home { font-size: 22px; font-weight: 700; padding: 2px 10px 2px 0; letter-spacing: -.01em; }
  #searchBtn {
    display: inline-flex; align-items: baseline; gap: 10px; min-width: 240px;
    padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--panel); font-size: 15px; text-align: left;
  }
  #searchBtn span { color: var(--muted); font-size: 12px; margin-left: auto; }
  #searchBtn:hover { border-color: var(--sign); }
  .chip {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 6px 11px; border: 1.5px solid var(--line); border-radius: 4px;
    font-size: 15px; color: var(--muted);
  }
  .chip b { font-weight: 600; color: var(--ink); }
  .chip .n { font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.empty { opacity: .45; }
  .chip:hover { border-color: var(--ink); }
  .chip.on { background: var(--sign); border-color: var(--sign); color: #1b2a33; }
  .chip.on b { color: #1b2a33; }
  .chip.cluster.on { background: var(--sea-glass); border-color: var(--sea-glass); }
  .sep { width: 1px; height: 22px; background: #33505f; margin: 0 4px; }
  #darkToggle { margin-left: auto; }
  #dailyLink, #mixLink, #cmpLink, #quizLink, #duelsLink { text-decoration: none; color: inherit; }

  /* --- Carte --- */
  #mapwrap { position: relative; min-height: 0; border-radius: 6px; overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.dragging { cursor: grabbing; }
  #map path, #map circle { stroke: var(--ocean); stroke-width: var(--sw, .6); fill: var(--land); }
  #map { transform-origin: 0 0; will-change: transform; }
  #map .c1 { fill: var(--sign-soft); }
  #map .c2 { fill: var(--sign); }
  #map .t1 { fill: #4f7f8f; }   /* no card, but a trainer covers the country */
  /* Weak spots: colour = your accuracy across trainers (tgm.stats), grey = not enough answers */
  #map .w0 { fill: #d9614c; } #map .w1 { fill: #e8995a; } #map .w2 { fill: #e9cf6a; } #map .w3 { fill: #9fcb7a; } #map .w4 { fill: #5fae7e; }
  #map .wmix { stroke: #ff5fa2; stroke-width: calc(var(--sw, .6) * 2.4); }
  #map .hover { fill: var(--land-hover); }
  #map .c1.hover, #map .c2.hover { fill: #ffe08a; }
  #map .t1.hover { fill: #6a9bab; }
  #map .incluster { stroke: var(--sea-glass); stroke-width: 1.6; }
  #map .sel { fill: #fff4cc; stroke: #fff; stroke-width: 1.8; }
  #map circle { stroke-width: calc(var(--sw, .6) * 1.6); }
  #map .relief { pointer-events: none; opacity: 0; transition: opacity .3s; }
  #map .relief.in { opacity: .55; }
  #tip {
    position: absolute; pointer-events: none; padding: 5px 9px; border-radius: 3px;
    background: var(--ink); color: #13232e; font-size: 14px; white-space: nowrap;
    transform: translate(12px, 12px); display: none;
  }
  #tip span { color: #5a6f7c; margin-left: 6px; }
  #legend { position: absolute; left: 12px; bottom: 12px; max-width: 270px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px;
    border: 1.5px solid var(--line); border-radius: 4px; background: rgba(14, 33, 48, .92); font-size: 13px; pointer-events: none; }
  #legend b { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  #legend > span { display: flex; align-items: center; gap: 7px; }
  #legend > span i { width: 16px; height: 10px; border-radius: 2px; flex: none; }
  #legend .wlegend { margin: 0; color: var(--ink); }
  .ghost { padding: 6px 10px; font-size: 13px; border: 1.5px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--ocean); }
  .ghost:hover { color: var(--ink); border-color: var(--ink); }
  #zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; border: 1.5px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
  #zoom button { width: 32px; height: 32px; display: grid; place-items: center; font-size: 19px; line-height: 1; color: var(--ink); border-bottom: 1px solid var(--line); }
  #zoom button:last-child { border-bottom: 0; }
  #zoom button:hover { background: #16303f; color: var(--sign); }
  @media (pointer: coarse) { #zoom button { width: 42px; height: 42px; } }

  /* --- Panneau et planche --- */
  #panel, #board { min-height: 0; overflow-y: auto; background: var(--panel); border-radius: 6px; scrollbar-width: thin; scrollbar-color: #33505f transparent; }
  #panel { padding: 22px 22px 28px; }
  #board { grid-column: 1 / -1; padding: 24px 28px 32px; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .head > div:first-child { flex: 1 1 12ch; min-width: 0; }
  .head h1 { margin: 0; font-size: clamp(26px, 2.4vw, 40px); font-weight: 700; line-height: 1; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .head .facts { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .head .iso { display: inline-block; margin-top: 8px; padding: 2px 7px; border: 1.5px solid var(--muted); border-radius: 3px; font-size: 13px; color: var(--muted); }
  .head .actions { display: flex; gap: 8px; align-items: center; flex: none; margin-left: auto; }
  .close { font-size: 26px; line-height: 1; color: var(--muted); padding: 0 4px; }
  .close:hover { color: var(--ink); }
  h2 { font-size: 17px; font-weight: 600; margin: 22px 0 10px; color: var(--sign); }
  .group-cluster h2 { color: var(--sea-glass); }
  details.sub { margin: 0 0 14px; border: 1px solid #33505f; border-radius: 6px; padding: 0 10px; }
  details.sub > summary { cursor: pointer; padding: 9px 2px; font-weight: 600; color: var(--ink); list-style-position: inside; }
  details.sub > summary small { margin-left: 8px; color: var(--muted); font-weight: 400; }
  details.sub[open] > summary { margin-bottom: 6px; }
  #board h2 { font-size: 20px; margin-top: 28px; }
  #board .grid { columns: 400px; column-gap: 16px; }
  #board .members { margin-bottom: 20px; }
  #board .card { break-inside: avoid; }
  .card { display: block; width: 100%; padding: 0; margin: 0 0 14px; text-align: left; border-radius: 4px; overflow: hidden; background: #fff; }
  .card.inv-on { background: var(--inv-bg); }
  .card img { display: block; width: 100%; height: auto; }
  img.inv { filter: invert(.9) hue-rotate(180deg); }
  img.dim { filter: brightness(.86); }   /* fiche claire non inversée : on adoucit le blanc en mode sombre */
  .card .cap { display: flex; gap: 8px; align-items: baseline; background: #16303f; color: var(--ink); padding: 7px 10px; font-size: 14px; }
  .card .cap small { color: var(--muted); font-size: 12px; }
  .card .cap .low { margin-left: auto; color: #e3a35a; font-size: 12px; }
  .card:hover .cap { background: #1e3d4f; }
  .hint { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 18px; max-width: 36ch; }
  .stats { display: flex; gap: 22px; margin: 6px 0 18px; }
  .stats div { font-size: 34px; font-weight: 700; line-height: 1; }
  .stats small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .members { display: flex; flex-wrap: wrap; gap: 6px; }
  .wlegend { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
  .wlegend i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }
  .wlegend .mx { border: 2px solid #ff5fa2; background: none; width: 14px; }
  .wlist { display: flex; flex-direction: column; }
  .wrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: var(--ink); font: inherit; }
  .wrow:hover b { color: var(--sign); }
  .wrow .acc { font-variant-numeric: tabular-nums; }
  .wrow small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .wbar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
  .wbar i { display: block; height: 100%; }
  .res-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  .res-row span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .res-row b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .mix h2 { display: flex; align-items: baseline; }
  .mix h2 .more, .mix-via a { color: var(--muted); font-size: 12px; text-decoration: none; }
  .mix h2 .more { margin-left: auto; font-weight: 400; }
  .mix h2 .more:hover, .mix-via a:hover { color: var(--sign); }
  .mix-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .mix-c { padding: 2px 8px; border: 1.5px solid var(--line); border-radius: 3px; font-size: 13px; }
  .mix-c:hover { border-color: var(--ink); }
  .mix-n { color: var(--sign); font-variant-numeric: tabular-nums; }
  .mix-cmp { color: var(--muted); text-decoration: none; padding: 0 2px; }
  .mix-cmp:hover { color: var(--sign); }
  .mix-via { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; color: var(--muted); font-size: 12px; }
  .members button { padding: 3px 8px; border: 1.5px solid var(--line); border-radius: 3px; font-size: 13px; }
  .members button:hover { border-color: var(--ink); }
  .members button.none { opacity: .5; }
  /* À compléter : couverture fiches + trainers par type et par tier */
  table.gaps { width: 100%; border-collapse: collapse; font-size: 13px; margin: 2px 0 10px; }
  table.gaps th { font-weight: 600; color: var(--muted); text-align: left; padding: 4px 4px; }
  table.gaps th small { font-weight: 400; }
  table.gaps td { padding: 2px 4px; }
  table.gaps td:first-child { color: var(--ink); white-space: nowrap; }
  table.gaps button { width: 100%; padding: 3px 6px; border: 1.5px solid var(--line); border-radius: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.gaps button:hover, table.gaps button.on { border-color: var(--ink); }
  table.gaps button.full { color: var(--sea-glass); }
  table.gaps button.low { color: var(--sign); }
  .gaps-list { margin-bottom: 12px; }
  .gaps-list p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
  /* --- Trainers (accueil) --- */
  .apps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .app { display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 4px; color: var(--ink); text-decoration: none; }
  .app-ext { border-style: dashed; }
  .app:hover { border-color: var(--sign); background: #16303f; }
  .app b { font-weight: 600; font-size: 15px; }
  .app small { color: var(--muted); font-size: 12px; }
  .country-apps { margin: 2px 0 10px; }
  .app-row { display: flex; gap: 6px; }
  .app-row .app { flex: 1; flex-direction: column; gap: 2px; }
  .app-row .app b { white-space: nowrap; }
  .lm { border: 1.5px dashed var(--line); border-radius: 4px; padding: 6px 10px; }
  .lm summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--ink); }
  .lm summary small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .lm ul { list-style: none; margin: 6px 0 2px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .lm li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .lm li a { color: var(--ink); text-decoration: none; }
  .lm li a:hover { color: var(--sign); }
  .lm li .lv { flex: none; width: 18px; text-align: center; font-size: 11px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
  .lm li .ml { margin-left: auto; flex: none; color: var(--muted); font-size: 12px; }
  .app .wip { margin-left: auto; flex: none; padding: 1px 6px; border: 1px solid var(--sign-soft); border-radius: 3px; color: var(--sign-soft); font-size: 11px; }
  .empty-state { color: var(--muted); font-size: 15px; line-height: 1.5; }
  kbd { font-family: inherit; font-size: 12px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; }

  /* --- Visionneuse --- */
  #lightbox { position: fixed; inset: 0; background: rgba(6, 16, 24, .95); display: none; z-index: 10; }
  #lightbox.open { display: block; }
  #stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; background: #fff; max-width: none; }
  #lbbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    background: linear-gradient(transparent, rgba(6,16,24,.92));
  }
  #lbbar .t { flex: 1; font-size: 17px; }
  #lbbar .t small { color: var(--muted); margin-left: 8px; font-size: 14px; }
  #lbbar .t .src { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  #lbbar .t .src a { color: inherit; }
  #lbbar button { padding: 7px 13px; border: 1.5px solid var(--line); border-radius: 4px; font-size: 15px; background: var(--ocean); }
  #lbbar button:hover { border-color: var(--ink); }
  #lbbar button:disabled { opacity: .35; cursor: default; }
  #lbbar button.on { background: var(--sign); border-color: var(--sign); color: #1b2a33; }

  /* --- Palette de recherche --- */
  #palette { position: fixed; inset: 0; z-index: 30; background: rgba(6,16,24,.55); display: none; }
  #palette.open { display: block; }
  #pbox {
    position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); width: min(720px, 92vw);
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  #pinput { width: 100%; padding: 16px 20px; font-size: 22px; background: transparent; border: 0; border-bottom: 1.5px solid var(--line); outline: none; }
  #pinput::placeholder { color: #5d7787; }
  #presults { max-height: 60vh; overflow-y: auto; }
  .pr { display: flex; align-items: center; gap: 14px; width: 100%; padding: 8px 20px; text-align: left; font-size: 16px; }
  .pr img { width: 72px; height: 48px; object-fit: cover; border-radius: 3px; background: #fff; flex: none; }
  .pr .ico { width: 72px; height: 48px; flex: none; display: grid; place-items: center; border: 1.5px dashed var(--line); border-radius: 3px; color: var(--muted); font-size: 12px; }
  .pr .txt { flex: 1; min-width: 0; }
  .pr .txt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pr .kind { color: var(--muted); font-size: 12px; }
  .pr.active { background: #1e3d4f; box-shadow: inset 3px 0 0 var(--sign); }
  .pgrp { padding: 10px 20px 3px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pr .ico.go { border-style: solid; border-color: #4f7f8f; background: rgba(79, 127, 143, .22); color: var(--ink); font-size: 17px; }
  .pr .ico.ext { color: var(--ink); font-size: 17px; }
  .pnone { padding: 18px 20px; color: var(--muted); font-size: 15px; }
  #phelp { padding: 8px 20px; font-size: 12px; color: var(--muted); border-top: 1.5px solid var(--line); }

  /* --- Bande de vignettes dans la visionneuse --- */
  #strip {
    position: absolute; left: 0; right: 0; bottom: 58px;
    display: flex; gap: 8px; justify-content: center; padding: 6px 20px; overflow-x: auto;
  }
  #strip button { flex: none; padding: 0; border: 2px solid transparent; border-radius: 4px; overflow: hidden; opacity: .6; background: #fff; }
  #strip button.cur { border-color: var(--sign); opacity: 1; }
  #strip button:hover { opacity: 1; }
  #strip img { display: block; height: 56px; width: auto; }
  #lbmsg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #e3a35a; font-size: 15px; }

  #menuBtn { display: none; }
  #tools { display: contents; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 45% 1fr; }
  }
  /* --- Téléphone : en-tête compact (☰), types en bande défilante, carte puis panneau dans le flux de la page --- */
  @media (max-width: 700px) {
    html, body { height: auto; overflow: auto; }
    #app { display: block; height: auto; padding: 10px 12px 20px; }
    header { flex-wrap: nowrap; gap: 6px; position: relative; margin-bottom: 8px; }
    #home { font-size: 19px; padding-right: 4px; }
    #searchBtn { min-width: 0; flex: 1; padding: 7px 10px; }
    #searchBtn span { display: none; }
    #menuBtn { display: inline-flex; flex: none; padding: 6px 12px; font-size: 18px; border: 1.5px solid var(--line); border-radius: 4px; }
    #menuBtn.on { border-color: var(--sign); color: var(--sign); }
    #tools { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; flex-direction: column; align-items: stretch; gap: 6px;
      background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.45); min-width: 200px; }
    #tools.open { display: flex; }
    #tools .chip { justify-content: space-between; margin: 0; }
    #darkToggle { margin-left: 0; }
    #chipsRow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 8px; }
    #chipsRow::-webkit-scrollbar { display: none; }
    #chipsRow .chip { flex: none; padding: 5px 10px; font-size: 14px; }
    #mapwrap { height: min(46vh, 58vw); min-height: 200px; margin-bottom: 10px; }
    #zoom { right: 8px; bottom: 8px; }
    #legend { left: 6px; bottom: 6px; right: 62px; max-width: none; padding: 4px 7px; font-size: 11px; flex-direction: row; flex-wrap: wrap; gap: 2px 9px; }
    #legend b { display: none; }
    #legend > span { gap: 4px; }
    #legend > span i { width: 10px; }
    #panel, #board { overflow: visible; }
    #panel { padding: 16px 14px 22px; }
    #board { padding: 16px 14px 24px; }
    #board .grid { columns: 1; }
    #pbox { top: 8px; width: calc(100vw - 16px); }
    #pinput { font-size: 18px; padding: 12px 14px; }
    #presults { max-height: 70vh; }
    .pr { padding: 8px 12px; }
    .pgrp { padding: 8px 12px 2px; }
    .pr img, .pr .ico { width: 56px; height: 38px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!-- tgm-pwa : hors-ligne et installation, généré par Atlas/tools/pwa.py -->
<link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#12283a">
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
<!-- /tgm-pwa -->
</head>
<body>
<div id="app">
  <header>
    <button id="home" title="Home (Esc)">Atlas</button>
    <button id="searchBtn" title="Search (type anywhere)">Search<span>just type</span></button>
    <span id="chipsRow" style="display:contents"><span id="chips" style="display:contents"></span></span>
    <button id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
    <div id="tools">
    <button id="darkToggle" class="chip"><b>Dark cards</b><span class="n" id="darkState"></span></button>
    <a id="dailyLink" class="chip" href="daily.html" title="Daily review (2 × 30 min)"><b>Review</b><span class="n">⏱</span></a>
    <a id="mixLink" class="chip" href="confusions.html" title="Countries you mix up, across trainers"><b>Mix-ups</b><span class="n">⇄</span></a>
    <button id="weakToggle" class="chip" title="Colour the map by your accuracy in the trainers"><b>Weak spots</b><span class="n" id="weakState"></span></button>
    <a id="cmpLink" class="chip" href="compare.html" title="Two countries side by side"><b>Compare</b><span class="n">⚖</span></a>
    <a id="quizLink" class="chip" href="quiz.html" title="Recall the cards, spaced repetition"><b>Quiz</b><span class="n">⟳</span></a>
    <a id="duelsLink" class="chip" href="games.html" title="Your Duels and Team Duels, place by place (imported from geo-review, stays in this browser)"><b>Duels</b><span class="n">⚔</span></a>
    </div>
  </header>
  <div id="mapwrap">
    <svg id="map" role="img" aria-label="World map"></svg>
    <div id="tip"></div>
    <div id="legend"></div>
    <div id="zoom"><button id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button><button id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button><button id="fit" aria-label="Fit" title="Fit the selected country, or the whole world"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button></div>
  </div>
  <aside id="panel"></aside>
  <section id="board"></section>
</div>

<div id="palette" role="dialog" aria-modal="true">
  <div id="pbox">
    <input id="pinput" type="text" placeholder="Country, clue or trainer…" autocomplete="off" spellcheck="false">
    <div id="presults" role="listbox"></div>
    <div id="phelp"><kbd>↑</kbd> <kbd>↓</kbd> pick, <kbd>Enter</kbd> open, <kbd>Esc</kbd> close · try “phone br”, “bollard france”, “plonk jp”</div>
  </div>
</div>

<div id="lightbox" aria-modal="true" role="dialog">
  <div id="stage"><img id="lbimg" alt="" decoding="async"></div>
  <div id="strip"></div>
  <div id="lbmsg"></div>
  <div id="lbbar">
    <div class="t" id="lbtitle"></div>
    <button id="lbinv" title="Invert the colours of this card">Dark</button>
    <button id="lbfit" title="Fit (Space)">Fit</button>
    <button id="lbprev" title="Previous (←)">Previous</button>
    <button id="lbnext" title="Next (→)">Next</button>
    <button id="lbclose" title="Close (Esc)">Close</button>
  </div>
</div>

<script src="tgm-core.js"></script>
<script src="map.js"></script>
<script src="data.js"></script>
<script src="learnable.js"></script>
<script>
(() => {
  const { types, clusters, cards, apps = [] } = window.ATLAS;
  const W = window.WORLD;
  const typeLabel = Object.fromEntries(types.map(t => [t.key, t.label]));
  const nameOf = iso => W.namesEn[iso] || W.names[iso] || iso;
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';

  // Fiches passées de other/ à regions/ (2026-11) : la progression du quiz et le choix « sombre » suivent leur nouvel identifiant
  (() => {
    const moved = ['ID Indonesia/other/Kabupaten/', 'ID Indonesia/other/Provinces.png', 'VN Vietnam/other/Provinces.png', 'PH Philippines/other/Régions'];
    for (const key of ['atlas.quiz', 'atlas.inv']) {
      try {
        const o = JSON.parse(localStorage.getItem(key));
        if (!o || typeof o !== 'object') continue;
        let changed = false;
        for (const k of Object.keys(o)) {
          if (!moved.some(m => k.startsWith(m))) continue;
          const n = k.replace('/other/', '/regions/');
          if (!(n in o)) o[n] = o[k];
          delete o[k]; changed = true;
        }
        if (changed) localStorage.setItem(key, JSON.stringify(o));
      } catch (e) {}
    }
  })();

  // ---------- Préférences locales ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('atlas.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('atlas.' + k, JSON.stringify(v)); } catch {} },
  };
  let dark = store.get('dark', true);
  const invOverride = store.get('inv', {});
  const isInv = c => dark && (c.id in invOverride ? invOverride[c.id] : c.invert);
  const imgCls = c => isInv(c) ? 'inv' : (dark && c.light ? 'dim' : '');

  const state = { country: null, type: null, cluster: null, view: 'map' };
  let visible = [];

  const matchType = c => !state.type || c.types.includes(state.type);
  // Trainers qui couvrent un pays : deeplink ({iso}) pour un trainer monde, sinon trainer de ce pays
  // Plonk It : lien vers la page publique du pays (lien seulement, aucun contenu repris).
  // Slug et liste des pays : countries.json, via tgm-core.js (cœur commun avec les trainers).
  const plonkitLink = iso => window.TGM ? TGM.plonkitUrl(iso) : null;
  const appLink = (a, iso) => a.deeplink ? a.deeplink.replace('{iso}', iso.toLowerCase()) : a.url;
  const countryApps = (iso, type) => apps.filter(a => a.countries.includes(iso) && (a.deeplink || a.scope === 'country')
    && (!type || a.types.includes(type)));
  const countryCards = iso => cards.filter(c => c.countries.includes(iso) && matchType(c));
  const countAll = iso => cards.filter(c => c.countries.includes(iso)).length;
  const trainerCount = iso => countryApps(iso).length;
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  // ---------- En-tête : types, clusters, mode sombre ----------
  function renderChips() {
    const f = $('chips');
    f.innerHTML = '';
    const base = state.country ? cards.filter(c => c.countries.includes(state.country)) : cards;
    for (const t of types) {
      const n = base.filter(c => c.types.includes(t.key)).length;
      const tr = state.country ? countryApps(state.country, t.key) : [];
      if (!n && !tr.length && state.type !== t.key) continue;   // types qui ont des fiches, ou un trainer pour ce pays
      const b = document.createElement('button');
      b.className = 'chip' + (state.type === t.key ? ' on' : '') + (n || tr.length ? '' : ' empty');
      b.innerHTML = `<b>${t.label}</b><span class="n">${n}${tr.length ? ' ↗' : ''}</span>`;
      if (tr.length) b.title = `Trainer: ${tr.map(a => a.name.en).join(', ')}`;
      b.onclick = () => {
        // un trainer couvre ce pays pour ce type : on l'ouvre (nouvel onglet), et l'Atlas filtre ses fiches s'il en a
        if (tr.length && state.type !== t.key) window.open(appLink(tr[0], state.country), '_blank', 'noopener');
        if (!n && tr.length) return;
        if (state.type === t.key) { state.type = null; state.view = 'map'; }
        else { state.type = t.key; state.view = state.country ? state.view : 'board'; }
        update();
      };
      f.appendChild(b);
    }
    const keys = Object.keys(clusters);
    if (keys.length) {
      f.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }));
      for (const k of keys) {
        const b = document.createElement('button');
        b.className = 'chip cluster' + (state.cluster === k ? ' on' : '');
        b.innerHTML = `<b>${clusters[k].label}</b>`;
        b.onclick = () => selectCluster(state.cluster === k ? null : k);
        f.appendChild(b);
      }
    }
    $('darkState').textContent = dark ? 'on' : 'off';
    $('weakState').textContent = weak ? 'on' : 'off';
    $('weakToggle').classList.toggle('on', weak);
    $('darkToggle').classList.toggle('on', dark);
  }
  $('darkToggle').onclick = () => { dark = !dark; store.set('dark', dark); update(); };

  // ---------- Weak spots : tgm.stats (byCountry de chaque trainer) + tgm.confusions ----------
  let weak = store.get('weak', false);
  const APP_NAME = { 'city-placer': 'City Placer', 'phone-codes': 'Phone codes', 'plate-trainer': 'Plates', 'bollards': 'Bollards',
    'sign-reader': 'Sign Reader', 'vietnam': 'Vietnam', 'kabupaten': 'Kabupaten', 'cyrillic': 'Cyrillic', 'clue-fusion': 'Clue Fusion', 'atlas-quiz': 'Card quiz', 'duels': 'Duels' };
  const WMIN = 3;                                   // answers needed before a country gets a colour
  const wBucket = a => a < 0.5 ? 0 : a < 0.65 ? 1 : a < 0.8 ? 2 : a < 0.9 ? 3 : 4;
  const WCOL = ['#d9614c', '#e8995a', '#e9cf6a', '#9fcb7a', '#5fae7e'];
  const pct = a => Math.round(a * 100) + ' %';
  const WLEGEND = `<div class="wlegend">${WCOL.map(c => `<i style="background:${c}"></i>`).join('')}<span>&lt;50 % → 90 %+ accuracy, all trainers · plain: under ${WMIN} answers</span><i class="mx"></i><span>mixed up in the last 60 days</span></div>`;
  // Légende posée sur la carte : elle suit ce que les couleurs veulent dire (couverture, un type, ou ta précision)
  function renderLegend() {
    const row = (c, t) => `<span><i style="background:${c}"></i>${t}</span>`;
    $('legend').innerHTML = weak ? '<b>My accuracy</b>' + WLEGEND
      : state.type ? `<b>${typeLabel[state.type]}</b>` + row('var(--sign)', '2+ cards') + row('var(--sign-soft)', '1 card, or a trainer') + row('var(--land)', 'nothing yet')
      : '<b>Coverage</b>' + row('var(--sign)', '2+ cards') + row('var(--sign-soft)', '1 card') + row('#4f7f8f', 'trainer only') + row('var(--land)', 'nothing yet');
  }
  let WD = null;
  function weakData() {
    if (WD) return WD;
    const by = {};
    const all = window.TGM && TGM.stats ? TGM.stats.all() : {};
    for (const [app, s] of Object.entries(all)) {
      for (const [iso, c] of Object.entries((s && s.byCountry) || {})) {
        if (!c || !c.seen) continue;
        const k = iso.toUpperCase(), w = by[k] = by[k] || { seen: 0, correct: 0, apps: {}, mix: 0 };
        w.seen += c.seen; w.correct += c.correct || 0;
        w.apps[app] = { seen: c.seen, correct: c.correct || 0, mastered: c.mastered || 0 };
      }
    }
    const pairs = window.TGM && TGM.confusions ? TGM.confusions.pairs({ days: 60 }) : [];
    for (const p of pairs) for (const k of [p.a, p.b]) { (by[k] = by[k] || { seen: 0, correct: 0, apps: {}, mix: 0 }).mix += p.n; }
    for (const w of Object.values(by)) w.acc = w.seen ? w.correct / w.seen : null;
    return (WD = by);
  }
  addEventListener('storage', e => { if (e.key && e.key.startsWith('tgm.')) { WD = null; if (weak) update(); } });
  $('weakToggle').onclick = () => { weak = !weak; store.set('weak', weak); update(); };
  // Liste des points faibles (accueil, mode Weak spots) : précision la plus basse d'abord, pays fréquents en tête à égalité
  function weakEl() {
    const d = weakData();
    const s = document.createElement('section');
    s.innerHTML = '<h2>Weak spots</h2>';
    const tier = k => (window.TGM && TGM.tier(k)) || 4;
    const list = Object.entries(d).filter(([, w]) => w.seen >= 5)
      .sort((a, b) => a[1].acc - b[1].acc || tier(a[0]) - tier(b[0])).slice(0, 12);
    if (!list.length) {
      s.appendChild(empty('No results yet on this browser: play a few rounds in the trainers (same site), they show up here.'));
      return s;
    }
    const box = Object.assign(document.createElement('div'), { className: 'wlist' });
    for (const [k, w] of list) {
      const b = Object.assign(document.createElement('button'), { className: 'wrow' });
      const by = Object.entries(w.apps).sort((x, y) => x[1].correct / x[1].seen - y[1].correct / y[1].seen)
        .map(([a, c]) => `${APP_NAME[a] || a} ${pct(c.correct / c.seen)}`).join(' · ');
      b.innerHTML = `<b>${window.TGM ? TGM.flag(k) : ''} ${nameOf(k)}</b><span class="acc">${pct(w.acc)} <small style="display:inline">/ ${w.seen}</small></span>`
        + `<div class="wbar"><i style="width:${Math.max(3, w.acc * 100)}%;background:${WCOL[wBucket(w.acc)]}"></i></div><small>${by}${w.mix ? ` · ${w.mix} mix-up${w.mix > 1 ? 's' : ''}` : ''}</small>`;
      b.onclick = () => selectCountry(k);
      box.appendChild(b);
    }
    s.appendChild(box);
    return s;
  }
  // Résultats du pays dans chaque trainer (fiche pays)
  function resultsEl(iso) {
    const w = weakData()[iso];
    if (!w || !w.seen) return null;
    const s = document.createElement('section');
    s.innerHTML = `<h2>Your results<a class="more" href="compare.html#${iso.toLowerCase()}">compare →</a></h2>`
      + Object.entries(w.apps).sort((a, b) => b[1].seen - a[1].seen).map(([a, c]) =>
        `<div class="res-row">${APP_NAME[a] || a}<span>${c.seen} answer${c.seen > 1 ? 's' : ''}</span><b style="color:${WCOL[wBucket(c.correct / c.seen)]}">${pct(c.correct / c.seen)}</b></div>`).join('')
      + (Object.keys(w.apps).length > 1 ? `<div class="res-row"><b>All</b><span>${w.seen}</span><b>${pct(w.acc)}</b></div>` : '');
    s.classList.add('mix');
    return s;
  }
  $('home').onclick = () => reset();

  function reset() { Object.assign(state, { country: null, type: null, cluster: null, view: 'map' }); update(); }
  function selectCountry(iso) { pushNext = iso !== state.country; Object.assign(state, { country: iso, cluster: null, view: 'map' }); update(); fitTo(iso); }
  function selectCluster(k) { Object.assign(state, { cluster: k, country: null, view: k ? 'board' : 'map' }); update(); }
  function selectType(t) { Object.assign(state, { type: t, country: null, cluster: null, view: 'board' }); update(); }

  // ---------- Recherche intelligente ----------
  // Chaque mot de la requête doit correspondre à quelque chose de la fiche :
  // pays (FR, EN, code ISO), type (libellé + alias), cluster, ou titre.
  const words = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
  const EXTRA = { GB: ['uk', 'angleterre', 'england', 'ecosse', 'scotland'], US: ['usa', 'etats unis', 'america'], AE: ['uae', 'emirats'], CZ: ['czechia', 'tcheque'], NL: ['hollande', 'holland'], KR: ['coree'], RU: ['russia'], ZA: ['rsa'] };
  const field = (labels, codes = []) => ({ w: [...new Set(labels.flatMap(words))], codes: codes.map(c => c.toLowerCase()) });
  const countryField = {};
  for (const iso of Object.keys(W.names)) countryField[iso] = field([W.names[iso], W.namesEn[iso] || '', ...(EXTRA[iso] || [])], [iso]);
  const typeField = Object.fromEntries(types.map(t => [t.key, field([t.label, t.key, ...(t.aliases || [])])]));
  const clusterField = Object.fromEntries(Object.entries(clusters).map(([k, c]) => [k, field([c.label, k, ...(c.aliases || [])])]));
  const worldField = field(['monde', 'world', 'mondial', 'global']);

  function oneEdit(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0, j = 0, e = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++e > 1) return false;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
    }
    return e + (a.length - i) + (b.length - j) <= 1;
  }
  const subseq = (q, w) => { if (q[0] !== w[0]) return false; let i = 0; for (const ch of w) { if (ch === q[i]) i++; if (i === q.length) return true; } return false; };

  function tokScore(q, f) {
    let best = f.codes.includes(q) ? 7 : 0;
    for (const w of f.w) {
      if (w === q) best = Math.max(best, 6);
      else if (w.startsWith(q)) best = Math.max(best, q.length >= 2 ? 4.5 : 1.5);
      else if (q.length >= 4 && (oneEdit(q, w) || oneEdit(q, w.slice(0, q.length)))) best = Math.max(best, 3);
      else if (q.length >= 2 && q.length <= 4 && subseq(q, w)) best = Math.max(best, 2);
    }
    return best;
  }
  const cardFields = c => [
    ...c.countries.map(i => countryField[i]).filter(Boolean),
    ...c.types.map(t => typeField[t]),
    ...(c.cluster ? [clusterField[c.cluster]] : []),
    ...(c.world ? [worldField] : []),
    field([c.title]),
    ...(c.group ? [field([c.group])] : []),
  ];
  function scoreAll(qs, fields) {
    let total = 0;
    for (const q of qs) {
      const best = Math.max(0, ...fields.map(f => tokScore(q, f)));
      if (!best) return 0;
      total += best;
    }
    return total;
  }

  // Trainers et liens externes : trouvés par leur nom ou leur type, seuls (« sign reader ») ou avec un pays (« bollard france », « plonk jp »)
  const typeWords = t => [typeLabel[t], t, ...((types.find(x => x.key === t) || {}).aliases || [])];
  const appName = Object.fromEntries(apps.map(a => [a.id, field([a.name.en, a.name.fr || '', a.id])]));
  const appField = Object.fromEntries(apps.map(a => [a.id, field([a.name.en, a.name.fr || '', a.id, ...a.types.flatMap(typeWords)])]));
  const center = iso => (window.SV_CENTER || {})[iso];
  const REFS = [
    { name: 'Plonk It', sub: 'country guide', f: field(['plonk', 'plonkit', 'guide']), href: iso => plonkitLink(iso) },
    { name: 'Street View', sub: 'country coverage', f: field(['street', 'streetview', 'sv', 'coverage']),
      href: iso => center(iso) ? `https://www.google.com/maps/@${center(iso)[0]},${center(iso)[1]},${center(iso)[2]}z/data=!5m1!1e5` : null },
    { name: 'Relief', sub: 'topography', f: field(['relief', 'topo', 'topography']),
      href: iso => center(iso) ? `https://opentopomap.org/#map=${center(iso)[2]}/${center(iso)[0]}/${center(iso)[1]}` : null },
  ];
  // Chaque mot va à la chose (trainer, lien) ou au pays ; il en faut au moins un de chaque côté
  function splitMatch(qs, fThing, fCountry) {
    let s = 0, a = 0, c = 0;
    for (const q of qs) {
      const sa = tokScore(q, fThing), sc = tokScore(q, fCountry);
      if (!sa && !sc) return 0;
      if (sa >= sc) a++; else c++;
      s += Math.max(sa, sc);
    }
    return a && c ? s : 0;
  }
  const best = (list, max) => { list.sort((x, y) => y.s - x.s); return list.filter(r => r.s === list[0].s).slice(0, max); };
  const hasContent = iso => countAll(iso) || trainerCount(iso);

  function searchAll(text) {
    const qs = words(text);
    if (!qs.length) return [];
    const cardRes = cards.map(c => ({ c, s: scoreAll(qs, cardFields(c)) })).filter(r => r.s)
      .sort((a, b) => b.s - a.s || a.c.title.localeCompare(b.c.title, 'fr')).slice(0, 8)
      .map(r => ({ kind: 'card', s: r.s, c: r.c }));
    let appRes = [];
    for (const a of apps) {
      const named = qs.some(q => tokScore(q, appName[a.id]) >= 3) ? 1 : 0;
      const alone = scoreAll(qs, [appField[a.id]]);
      if (alone) { appRes.push({ kind: 'app', s: alone + named, a, iso: null, href: a.url }); continue; }
      if (qs.length < 2) continue;
      const pairs = a.countries.filter(iso => countryField[iso]).map(iso => ({ kind: 'app', s: splitMatch(qs, appField[a.id], countryField[iso]) + named, a, iso, href: appLink(a, iso) })).filter(r => r.s > named);
      if (pairs.length) appRes.push(...best(pairs, 2));
    }
    appRes = appRes.sort((x, y) => y.s - x.s || x.a.name.en.localeCompare(y.a.name.en, 'en')).slice(0, 4);
    let refRes = [];
    if (qs.length >= 2) for (const R of REFS) {
      const pairs = Object.keys(countryField).map(iso => ({ kind: 'ref', s: splitMatch(qs, R.f, countryField[iso]), name: R.name, sub: R.sub, iso, href: R.href(iso) })).filter(r => r.s && r.href);
      if (pairs.length) refRes.push(...best(pairs, 1));
    }
    refRes = refRes.sort((x, y) => y.s - x.s).slice(0, 2);
    let countries = [], others = [];
    const cScore = iso => (countAll(iso) ? 1 : 0) + (trainerCount(iso) ? 0.5 : 0);
    for (const iso in countryField) { const s = scoreAll(qs, [countryField[iso]]); if (s) countries.push({ kind: 'country', s: s + cScore(iso), iso }); }
    for (const t of types) { const s = scoreAll(qs, [typeField[t.key]]); if (s) others.push({ kind: 'type', s, key: t.key }); }
    for (const k in clusters) { const s = scoreAll(qs, [clusterField[k]]); if (s) others.push({ kind: 'cluster', s, key: k }); }
    // Le pays d'un trainer ou d'un lien trouvé (« bollard france » → France) figure aussi dans la liste
    for (const r of [...appRes, ...refRes]) if (r.iso && !countries.some(c => c.iso === r.iso)) countries.push({ kind: 'country', s: r.s, iso: r.iso });
    // Rien de complet : on montre ce que chaque mot a trouvé seul (« phone bg » → Bulgarie, Bangladesh, Indicatifs tél.)
    if (!cardRes.length && !appRes.length && !refRes.length && !countries.length && !others.length) {
      for (const q of qs) {
        for (const iso in countryField) { const s = tokScore(q, countryField[iso]); if (s >= 2) countries.push({ kind: 'country', s: s + cScore(iso), iso }); }
        for (const t of types) { const s = tokScore(q, typeField[t.key]); if (s >= 3) others.push({ kind: 'type', s, key: t.key }); }
      }
    }
    // Un pays sans fiche ni trainer n'apporte rien dès qu'il y a mieux à montrer
    if (cardRes.length || appRes.length || refRes.length || countries.some(c => hasContent(c.iso))) countries = countries.filter(c => hasContent(c.iso));
    countries.sort((a, b) => b.s - a.s); others.sort((a, b) => b.s - a.s);
    // La requête est un nom de pays, rien d'autre : sa page passe devant ses fiches
    const justCountry = countries.length && qs.every(q => tokScore(q, countryField[countries[0].iso]) >= 4.5);
    const group = (label, list) => list.map(r => Object.assign(r, { group: label }));
    const C = group('Countries', countries.slice(0, 3)), K = group('Cards', cardRes), T = group('Trainers', appRes), R = group('References', refRes);
    return [...(justCountry ? [...C, ...K, ...T] : [...K, ...T, ...C]), ...R, ...group('Filters', others.slice(0, 3))];
  }

  // ---------- Palette ----------
  const palette = $('palette'), pinput = $('pinput'), presults = $('presults');
  let results = [], active = 0, rows = [];
  function openPalette(seed = '') {
    palette.classList.add('open');
    pinput.value = seed;
    pinput.focus();
    runSearch();
  }
  const closePalette = () => { palette.classList.remove('open'); pinput.blur(); };
  // Champ vide : les derniers pays ouverts
  function runSearch() {
    results = pinput.value.trim() ? searchAll(pinput.value) : recent().map(iso => ({ kind: 'country', iso, group: 'Recent' }));
    active = 0; paintResults();
  }
  const countrySub = iso => {
    const n = countAll(iso), k = trainerCount(iso);
    return !n && !k ? 'nothing yet' : (k ? plural(k, 'trainer') + ' · ' : '') + (n ? plural(n, 'card') : 'no card yet');
  };
  function paintResults() {
    presults.innerHTML = ''; rows = [];
    if (pinput.value.trim() && !results.length) {
      presults.innerHTML = '<div class="pnone">Nothing found. Try a country (English, French or ISO code) and a clue or a trainer: “phone br”, “bollard france”.</div>';
      return;
    }
    let last = null;
    results.forEach((r, i) => {
      if (r.group !== last) { last = r.group; presults.appendChild(Object.assign(document.createElement('div'), { className: 'pgrp', textContent: r.group })); }
      const b = document.createElement('button');
      b.className = 'pr' + (i === active ? ' active' : '');
      if (r.kind === 'card') {
        const c = r.c;
        const where = c.cluster ? clusters[c.cluster].label : c.world ? 'World' : c.countries.map(nameOf).join(', ');
        b.innerHTML = `<img src="${enc(c.thumb)}" class="${imgCls(c)}" alt=""><span class="txt">${where}<small>${c.types.map(t => typeLabel[t]).join(', ')}${c.group ? ', ' + c.group : ''}${c.title ? ', ' + c.title : ''}</small></span>`;
      } else if (r.kind === 'app') {
        b.innerHTML = `<span class="ico go">↗</span><span class="txt">${r.a.name.en}${r.iso ? ' · ' + nameOf(r.iso) : ''}<small>trainer · ${r.a.types.map(t => typeLabel[t]).join(', ')}${r.a.status === 'wip' ? ' · in progress' : ''}</small></span>`;
      } else if (r.kind === 'ref') {
        b.innerHTML = `<span class="ico ext">↗</span><span class="txt">${r.name} · ${nameOf(r.iso)}<small>${r.sub}</small></span>`;
      } else if (r.kind === 'country') {
        b.innerHTML = `<span class="ico">${r.iso}</span><span class="txt">${nameOf(r.iso)}<small>${countrySub(r.iso)}</small></span>`;
      } else {
        const label = r.kind === 'type' ? typeLabel[r.key] : clusters[r.key].label;
        const n = r.kind === 'type' ? cards.filter(c => c.types.includes(r.key)).length : cards.filter(c => c.cluster === r.key || c.countries.some(i => clusters[r.key].countries.includes(i))).length;
        b.innerHTML = `<span class="ico">${r.kind}</span><span class="txt">${label}<small>${n > 1 ? `see the ${n} cards` : n ? 'see the card' : 'no card yet'}</small></span>`;
      }
      b.onmousedown = e => { e.preventDefault(); choose(i); };
      b.onmousemove = () => { if (active !== i) { rows[active] && rows[active].classList.remove('active'); active = i; b.classList.add('active'); } };
      presults.appendChild(b); rows.push(b);
    });
    rows[active]?.scrollIntoView({ block: 'nearest' });
  }
  function choose(i) {
    const r = results[i];
    if (!r) return;
    const list = results.filter(x => x.kind === 'card').map(x => x.c);
    closePalette();
    if (r.kind === 'card') openLb(r.c, list);
    else if (r.kind === 'app' || r.kind === 'ref') window.open(r.href, '_blank', 'noopener');   // nouvel onglet, comme depuis la fiche pays
    else if (r.kind === 'country') openCountry(r.iso);
    else if (r.kind === 'type') selectType(r.key);
    else selectCluster(r.key);
  }
  pinput.addEventListener('input', runSearch);
  pinput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { active = Math.min(results.length - 1, active + 1); paintResults(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { active = Math.max(0, active - 1); paintResults(); e.preventDefault(); }
    else if (e.key === 'Enter') { choose(active); e.preventDefault(); }
    else if (e.key === 'Escape') { closePalette(); e.preventDefault(); }
    e.stopPropagation();
  });
  palette.addEventListener('mousedown', e => { if (e.target === palette) closePalette(); });
  $('searchBtn').onclick = () => openPalette();
  // Téléphone : menu ☰ (Dark cards, Review, Mix-ups, Weak spots, Compare) ; la bande des types sort de l'en-tête
  const PHONE = matchMedia('(max-width: 700px)');
  const placeChips = () => {
    const row = $('chipsRow'), hdr = row.parentElement === document.querySelector('header');
    if (PHONE.matches && hdr) { row.removeAttribute('style'); document.querySelector('header').after(row); }
    else if (!PHONE.matches && !hdr) { row.style.display = 'contents'; $('searchBtn').after(row); }
  };
  placeChips(); PHONE.addEventListener('change', placeChips);
  const setMenu = on => { $('tools').classList.toggle('open', on); $('menuBtn').classList.toggle('on', on); $('menuBtn').setAttribute('aria-expanded', on); };
  $('menuBtn').onclick = e => { e.stopPropagation(); setMenu(!$('tools').classList.contains('open')); };
  document.addEventListener('click', e => { if (!e.target.closest('#tools, #menuBtn')) setMenu(false); });
  $('tools').addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });

  // Un pays : toujours sa fiche pays (trainers, liens, fiches) ; la planche reste à un clic
  let pushNext = false;                        // un changement de pays ajoute une entrée d'historique (bouton Retour)
  const recent = () => { const r = store.get('recent', []); return (Array.isArray(r) ? r : []).filter(k => typeof k === 'string' && countryField[k]).slice(0, 5); };
  function openCountry(iso, fit = true) {
    pushNext = iso !== state.country;
    store.set('recent', [iso, ...recent().filter(k => k !== iso)].slice(0, 5));
    Object.assign(state, { country: iso, cluster: null, type: null, view: 'map' });
    update();
    if (fit) fitTo(iso);
  }

  // ---------- Carte ----------
  const svg = $('map'), tip = $('tip');
  const g = document.createElementNS(SVGNS, 'g');
  svg.appendChild(g);
  const shapes = {};
  for (const c of W.countries) {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', c.d); p.dataset.iso = c.iso;
    g.appendChild(p); shapes[c.iso] = [p];
  }
  // Relief : ombrage Natural Earth reprojeté (relief.webp), fondu sur les pays, ne capte pas la souris
  const relief = document.createElementNS(SVGNS, 'image');
  relief.setAttribute('width', W.w); relief.setAttribute('height', W.h);
  relief.setAttribute('class', 'relief');
  g.appendChild(relief);
  // Le relief est un décor de 2,6 Mo : chargé une fois la carte affichée, jamais sur un écran de téléphone ni en économie de données
  const loadRelief = () => {
    if (PHONE.matches || (navigator.connection && navigator.connection.saveData)) return;
    relief.addEventListener('load', () => relief.classList.add('in'));
    relief.setAttribute('href', 'relief.webp');
    setTimeout(() => relief.classList.add('in'), 4000);
  };
  const whenIdle = window.requestIdleCallback ? f => requestIdleCallback(f, { timeout: 1500 }) : f => setTimeout(f, 300);
  if (document.readyState === 'complete') whenIdle(loadRelief); else addEventListener('load', () => whenIdle(loadRelief));
  const dots = document.createElementNS(SVGNS, 'g');
  g.appendChild(dots);
  for (const c of W.countries.filter(c => c.small)) {
    const d = document.createElementNS(SVGNS, 'circle');
    d.setAttribute('cx', c.c[0]); d.setAttribute('cy', c.c[1]); d.dataset.iso = c.iso;
    dots.appendChild(d); shapes[c.iso].push(d);
  }

  function paintMap() {
    const inCluster = new Set(state.cluster ? clusters[state.cluster].countries : []);
    for (const iso in shapes) {
      // un type choisi : un pays couvert par un trainer de ce type (ex. phone-codes) compte comme couvert
      const n = countryCards(iso).length || (state.type && countryApps(iso, state.type).length ? 1 : 0);
      const w = weak ? weakData()[iso] : null, wb = w && w.seen >= WMIN ? wBucket(w.acc) : -1;
      const tr = weak || state.type ? 0 : trainerCount(iso);
      for (const el of shapes[iso]) {
        el.classList.toggle('c1', !weak && n === 1);
        el.classList.toggle('c2', !weak && n >= 2);
        el.classList.toggle('t1', !n && tr > 0);
        for (let i = 0; i < 5; i++) el.classList.toggle('w' + i, wb === i);
        el.classList.toggle('wmix', !!(w && w.mix));
        el.classList.toggle('sel', state.country === iso);
        el.classList.toggle('incluster', inCluster.has(iso));
      }
      if (shapes[iso][1]) shapes[iso][1].style.display = n || tr || wb >= 0 || state.country === iso || inCluster.has(iso) ? '' : 'none';
    }
  }

  let vb = { x: 0, y: 0, w: W.w, h: W.h };
  let shown = { ...vb }, commitT = 0;
  const wrapRect = () => svg.parentElement.getBoundingClientRect();
  const fitOf = (v, r) => { const s = Math.max(v.w / r.width, v.h / r.height); return { s, ox: (r.width * s - v.w) / 2, oy: (r.height * s - v.h) / 2 }; };
  const applyVb = () => {
    clearTimeout(commitT);
    svg.style.transform = '';
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    shown = { ...vb };
    const { s } = fitOf(vb, wrapRect());
    svg.style.setProperty('--sw', (0.6 * s).toFixed(3));   // trait constant à l'écran, sans vector-effect
    const r = Math.max(1.2, 5 * vb.w / W.w);
    for (const d of dots.children) d.setAttribute('r', r);
  };
  // Pendant un geste : transform CSS de shown vers vb (aucun re-rendu SVG), puis applyVb au repos
  const previewVb = () => {
    const r = wrapRect(), a = fitOf(shown, r), b = fitOf(vb, r), k = a.s / b.s;
    const tx = (shown.x - a.ox - vb.x + b.ox) / b.s, ty = (shown.y - a.oy - vb.y + b.oy) / b.s;
    svg.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
    clearTimeout(commitT);
    commitT = setTimeout(() => { if (!drag) applyVb(); }, 160);
  };
  const resetVb = () => { vb = { x: 0, y: 0, w: W.w, h: W.h }; applyVb(); };
  resetVb();
  // Zoom : boutons, clavier (+ et −) et molette partagent la même limite ; « fit » cadre le pays choisi, sinon le monde
  const MAXZ = 12;
  function zoomBy(f) {
    const nw = Math.min(W.w, Math.max(W.w / MAXZ, vb.w * f)), k = nw / vb.w;
    vb = nw >= W.w ? { x: 0, y: 0, w: W.w, h: W.h } : { x: vb.x + vb.w * (1 - k) / 2, y: vb.y + vb.h * (1 - k) / 2, w: nw, h: vb.h * k };
    applyVb();
  }
  // Boîte du plus grand morceau d'un pays (la France sans la Guyane, les États-Unis sans Hawaï) ; un point pour les tout petits
  const boxes = {};
  function mainBox(iso) {
    if (iso in boxes) return boxes[iso];
    const c = W.countries.find(c => c.iso === iso);
    let best = null;
    if (c && c.small && c.c) { const k = W.w / 40; best = { x: c.c[0] - k / 2, y: c.c[1] - k / 2, w: k, h: k }; }
    else if (c) for (const part of c.d.split('M')) {
      const n = part.match(/-?\d+(?:\.\d+)?/g);
      if (!n || n.length < 6) continue;
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let i = 0; i + 1 < n.length; i += 2) { const x = +n[i], y = +n[i + 1]; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      const a = (x1 - x0) * (y1 - y0);
      if (!best || a > best.a) best = { a, x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    }
    return (boxes[iso] = best);
  }
  function fitTo(iso) {
    const b = mainBox(iso);
    if (!b) return;
    const pad = v => v + 2 * Math.min(0.7 * v, 120);                 // de la marge pour voir les voisins, sans noyer les grands pays
    const w = Math.min(W.w, Math.max(W.w / MAXZ, pad(b.w), pad(b.h) * W.w / W.h)), h = w * W.h / W.w;
    vb = { x: Math.min(W.w - w, Math.max(0, b.x + b.w / 2 - w / 2)), y: Math.min(W.h - h, Math.max(0, b.y + b.h / 2 - h / 2)), w, h };
    applyVb();
  }
  const fitView = () => state.country ? fitTo(state.country) : resetVb();
  $('zoomIn').onclick = () => zoomBy(1 / 1.6);
  $('zoomOut').onclick = () => zoomBy(1.6);
  $('fit').onclick = fitView;

  const toSvg = e => {
    const r = wrapRect(), { s, ox, oy } = fitOf(vb, r);
    return { x: vb.x - ox + (e.clientX - r.left) * s, y: vb.y - oy + (e.clientY - r.top) * s, s };
  };
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toSvg(e);
    const nw = Math.min(W.w, Math.max(W.w / MAXZ, vb.w * Math.exp(e.deltaY * 0.0015)));
    const f = nw / vb.w;
    vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: nw, h: vb.h * f };
    previewVb();
  }, { passive: false });

  let drag = null, hoverIso = null;
  const isoAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.dataset ? el.dataset.iso : null; };
  const setHover = iso => {
    if (iso === hoverIso) return;            // pas de restyle tant qu'on reste sur le même pays
    if (hoverIso) shapes[hoverIso].forEach(x => x.classList.remove('hover'));
    hoverIso = iso;
    if (iso) shapes[iso].forEach(x => x.classList.add('hover'));
  };
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(dx, dy) > 4) { drag.moved = true; svg.classList.add('dragging'); }
      if (drag.moved) { const { s } = toSvg(e); vb = { ...drag.vb, x: drag.vb.x - dx * s, y: drag.vb.y - dy * s }; setHover(null); tip.style.display = 'none'; previewVb(); return; }
    }
    if (e.pointerType === 'touch') return;          // pas d'infobulle au doigt : le tap ouvre la fiche
    const iso = (e.target && e.target.dataset && e.target.dataset.iso) || null;
    setHover(iso);
    if (iso) {
      const n = countryCards(iso).length;
      const tr = state.type ? countryApps(iso, state.type) : [];
      const k = state.type ? 0 : trainerCount(iso);
      const r = svg.parentElement.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = (e.clientX - r.left) + 'px';
      tip.style.top = (e.clientY - r.top) + 'px';
      const w = weak ? weakData()[iso] : null;
      tip.innerHTML = weak
        ? `${nameOf(iso)}<span>${w && w.seen ? `${pct(w.acc)} over ${w.seen} answer${w.seen > 1 ? 's' : ''}` : 'not played yet'}${w && w.mix ? ` · ${w.mix} mix-up${w.mix > 1 ? 's' : ''}` : ''}</span>`
        : `${nameOf(iso)}<span>${k ? plural(k, 'trainer') + ' · ' : ''}${n ? plural(n, 'card') : 'no card'}${tr.length ? ' · trainer ↗' : ''}</span>`;
    } else tip.style.display = 'none';
  });
  svg.addEventListener('pointerup', e => {
    const moved = drag && drag.moved;
    drag = null; svg.classList.remove('dragging');
    if (moved) { applyVb(); return; }
    const iso = isoAt(e);
    if (iso) {
      openCountry(iso, false);                 // cliqué sur la carte : on ne la déplace pas sous le pointeur
      if (PHONE.matches) requestAnimationFrame(() => $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }
    else { state.country = null; update(); }
  });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; setHover(null); });
  window.addEventListener('resize', applyVb);

  // ---------- Fiches ----------
  function cardEl(c, context, board) {
    const b = document.createElement('button');
    const inv = isInv(c);
    b.className = 'card' + (inv ? ' inv-on' : '');
    const where = c.cluster ? clusters[c.cluster].label : c.world ? 'World' : c.countries.map(nameOf).join(', ');
    const what = c.types.map(t => typeLabel[t]).join(', ') + (c.group ? ', ' + c.group : '') + (c.title ? ', ' + c.title : '');
    let title = c.title || c.types.map(t => typeLabel[t]).join(', ');
    let others = c.cluster ? clusters[c.cluster].label
      : c.world ? 'World'
      : c.countries.filter(x => x !== context).map(nameOf).join(', ');
    if (board) { [title, others, context] = state.country ? [what, '', null] : [where, what, null]; }
    b.innerHTML = `<img loading="lazy" decoding="async" class="${imgCls(c)}" src="${enc(c.thumb)}" width="${c.w}" height="${c.h}" alt="">`
      + `<span class="cap">${title}${others ? `<small>${context ? 'also ' : ''}${others}</small>` : ''}${c.lowres ? '<span class="low">low res</span>' : ''}</span>`;
    b.onclick = () => openLb(c);
    visible.push(c);
    return b;
  }
  // Sous-dossier de type (images/<pays>/<type>/<groupe>/fichier) : sous-section repliable sous les fiches simples
  const openGroups = new Set();
  function section(title, list, context, cls, grid) {
    if (!list.length) return null;
    const s = document.createElement('section');
    if (cls) s.className = cls;
    s.innerHTML = `<h2>${title}</h2>`;
    const fill = (parent, items) => {
      const box = grid ? Object.assign(document.createElement('div'), { className: 'grid' }) : parent;
      items.forEach(c => box.appendChild(cardEl(c, context)));
      if (grid) parent.appendChild(box);
    };
    fill(s, list.filter(c => !c.group));
    for (const [g, items] of groupBy(list.filter(c => c.group), c => [c.group])) {
      const key = title + '|' + g;
      const d = Object.assign(document.createElement('details'), { className: 'sub', open: openGroups.has(key) });
      d.innerHTML = `<summary>${g}<small>${items.length}</small></summary>`;
      d.ontoggle = () => d.open ? openGroups.add(key) : openGroups.delete(key);
      fill(d, items);
      s.appendChild(d);
    }
    return s;
  }
  function header(title, sub, actions, facts) {
    const h = document.createElement('div');
    h.className = 'head';
    h.innerHTML = `<div><h1>${title}</h1>${facts ? `<p class="facts">${facts.join(' · ')}</p>` : sub ? `<span class="iso">${sub}</span>` : ''}</div>`;
    const a = Object.assign(document.createElement('div'), { className: 'actions' });
    for (const [label, fn, cls] of actions) {
      const b = Object.assign(document.createElement('button'), { className: cls || 'ghost', textContent: label });
      b.onclick = fn; a.appendChild(b);
    }
    h.appendChild(a);
    return h;
  }
  // Résumé d'un pays en une ligne : code, continent et tier s'il est dans countries.json, puis ce que l'Atlas a sur lui
  function countryFacts(iso) {
    const f = [iso], c = window.TGM && TGM.country(iso);
    if (c) {
      const ct = TGM.continents[c.continent], t = TGM.tier(iso), tn = TGM.tierNames[t];
      if (ct) f.push(ct.en);
      f.push(`Tier ${t}${tn ? ' ' + tn.en.toLowerCase() : ''}`);
    }
    f.push(plural(countAll(iso), 'card'), plural(trainerCount(iso), 'trainer'));
    if (state.type) f.push(typeLabel[state.type] + ' only');
    return f;
  }
  const groupBy = (list, keyFn) => {
    const m = new Map();
    for (const c of list) for (const k of keyFn(c)) { if (!m.has(k)) m.set(k, []); m.get(k).push(c); }
    return m;
  };
  const empty = text => Object.assign(document.createElement('p'), { className: 'empty-state', textContent: text });
  const closeBtn = fn => ['×', fn, 'close'];

  // Contenu d'une sélection, partagé entre panneau et planche
  function membersEl() {
    const m = Object.assign(document.createElement('div'), { className: 'members' });
    for (const iso of clusters[state.cluster].countries) {
      const b = Object.assign(document.createElement('button'), { textContent: nameOf(iso) });
      if (!countAll(iso)) b.classList.add('none');
      b.onclick = () => selectCountry(iso);
      m.appendChild(b);
    }
    return m;
  }

  function selectionCards() {
    let list;
    if (state.country) list = countryCards(state.country);
    else if (state.cluster) list = cards.filter(c => (c.cluster === state.cluster || c.countries.some(i => clusters[state.cluster].countries.includes(i))) && matchType(c));
    else list = cards.filter(matchType);
    const where = c => c.cluster ? clusters[c.cluster].label : c.world ? 'World' : c.countries.map(nameOf).join(', ');
    return list.sort((a, b) => where(a).localeCompare(where(b), 'fr') || a.title.localeCompare(b.title, 'fr'));
  }

  function fillBoard(root) {
    // Un pays : rangé par type, les sous-dossiers en sections repliables
    if (state.country && countryCards(state.country).some(c => c.group)) return fillSelection(root, true);
    const list = selectionCards();
    if (!list.length) return root.appendChild(empty('No card for this selection.'));
    const grid = Object.assign(document.createElement('div'), { className: 'grid' });
    list.forEach(c => grid.appendChild(cardEl(c, null, true)));
    root.appendChild(grid);
  }

  function fillSelection(root, grid) {
    const add = el => el && root.appendChild(el);
    if (state.country) {
      const iso = state.country;
      add(countryTrainersEl(iso, state.type));
      if (!state.type) { add(mixEl(iso)); add(resultsEl(iso)); }
      const list = countryCards(iso);
      if (!list.length) return add(empty(state.type
        ? `No “${typeLabel[state.type]}” card for this country.`
        : `No card for this country yet. Put it in images\\${iso} ${nameOf(iso)}\\<type>\\ and run build.cmd.`));
      for (const [t, l] of groupBy(list.filter(c => !c.cluster), c => [c.types[0]])) add(section(typeLabel[t], l, iso, null, grid));
      for (const [k, l] of groupBy(list.filter(c => c.cluster), c => [c.cluster])) add(section(clusters[k].label, l, null, 'group-cluster', grid));
      return;
    }
    if (state.cluster) {
      const cl = clusters[state.cluster];
      add(membersEl());
      add(section('Cluster cards', cards.filter(c => c.cluster === state.cluster && matchType(c)), null, 'group-cluster', grid));
      for (const iso of cl.countries) add(section(nameOf(iso), countryCards(iso).filter(c => !c.cluster), iso, null, grid));
      return;
    }
    if (state.type) {
      const list = cards.filter(matchType);
      if (!list.length) return add(empty('No card of this type yet.'));
      add(section('World', list.filter(c => c.world), null, null, grid));
      for (const [k, l] of groupBy(list.filter(c => c.cluster), c => [c.cluster])) add(section(clusters[k].label, l, null, 'group-cluster', grid));
      const byCountry = groupBy(list.filter(c => !c.cluster && !c.world), c => c.countries);
      [...byCountry.keys()].sort((a, b) => nameOf(a).localeCompare(nameOf(b), 'en'))
        .forEach(iso => add(section(nameOf(iso), byCountry.get(iso), iso, null, grid)));
    }
  }

  function selectionTitle() {
    if (state.country) return [nameOf(state.country), state.country + (state.type ? `, ${typeLabel[state.type]}` : '')];
    if (state.cluster) return [clusters[state.cluster].label, `${clusters[state.cluster].countries.length} countries` + (state.type ? `, ${typeLabel[state.type]}` : '')];
    if (state.type) return [typeLabel[state.type], null];
    return null;
  }

  function renderPanel() {
    const panel = $('panel');
    panel.innerHTML = '';
    visible = [];
    const t = selectionTitle();
    if (t) {
      panel.appendChild(header(t[0], t[1], [
        ...(state.country ? [['Compare', () => { location.href = 'compare.html#' + state.country.toLowerCase(); }]] : []),
        ...(state.country && countAll(state.country) ? [['Quiz', () => { location.href = 'quiz.html#' + state.country.toLowerCase(); }]] : []),
        ['Board', () => { state.view = 'board'; update(); }],
        closeBtn(() => { state.country = state.cluster = null; if (!state.country) state.type = null; update(); }),
      ], state.country ? countryFacts(state.country) : null));
      fillSelection(panel, false);
      return;
    }
    panel.appendChild(header('Atlas', null, []));
    const nCountries = new Set(cards.flatMap(c => c.countries)).size;
    const st = Object.assign(document.createElement('div'), { className: 'stats' });
    st.innerHTML = `<div>${cards.length}<small>cards</small></div><div>${nCountries}<small>countries covered</small></div>`;
    panel.appendChild(st);
    if (weak) panel.appendChild(weakEl());
    const tr = trainersEl();
    tr && panel.appendChild(tr);
    const gp = gapsEl();
    gp && panel.appendChild(gp);
    const w = section('World', cards.filter(c => c.world));
    w && panel.appendChild(w);
  }

  // Trainers d'un pays (filtrés par type si un type est choisi), en tête de la fiche pays
  function countryTrainersEl(iso, type) {
    const list = countryApps(iso, type);
    const plonk = !type && plonkitLink(iso);
    const sv = !type && (window.SV_CENTER || {})[iso];
    const lm = !type ? (window.LEARNABLE || []).filter(m => m[2].split(' ').includes(iso)) : [];
    if (!list.length && !plonk && !sv && !lm.length) return null;
    const box = Object.assign(document.createElement('div'), { className: 'apps country-apps' });
    list.forEach(a => {
      const l = Object.assign(document.createElement('a'), { className: 'app', href: appLink(a, iso), target: '_blank', rel: 'noopener' });
      l.innerHTML = '<b></b><small></small>';
      l.querySelector('b').textContent = `${a.name.en} ↗`;
      l.querySelector('small').textContent = a.types.map(t => typeLabel[t]).join(', ');
      box.appendChild(l);
    });
    // Plonk It et Street View côte à côte (liens externes, bordure pointillée)
    const row = Object.assign(document.createElement('div'), { className: 'app-row' });
    if (plonk) {
      const l = Object.assign(document.createElement('a'), { className: 'app app-ext', href: plonk, target: '_blank', rel: 'noopener' });
      l.innerHTML = '<b>Plonk It ↗</b><small>country guide</small>';
      row.appendChild(l);
    }
    if (sv) {
      // Google Maps avec le calque de couverture Street View (data=!5m1!1e5)
      const l = Object.assign(document.createElement('a'), { className: 'app app-ext', target: '_blank', rel: 'noopener',
        href: `https://www.google.com/maps/@${sv[0]},${sv[1]},${sv[2]}z/data=!5m1!1e5` });
      l.innerHTML = '<b>Street View ↗</b><small>country coverage</small>';
      row.appendChild(l);
      // Carte topographique : OpenTopoMap (courbes de niveau, relief ombré), même centre et zoom
      const r = Object.assign(document.createElement('a'), { className: 'app app-ext', target: '_blank', rel: 'noopener',
        href: `https://opentopomap.org/#map=${sv[2]}/${sv[0]}/${sv[1]}` });
      r.innerHTML = '<b>Relief ↗</b><small>topography</small>';
      row.appendChild(r);
    }
    if (row.children.length) box.appendChild(row);
    // Maps LearnableMeta du pays (GeoGuessr) : jouer, ou ouvrir la liste des metas
    if (lm.length) {
      const order = { B: 0, I: 1, A: 2 }, lvName = { B: 'beginner', I: 'intermediate', A: 'advanced' };
      const d = Object.assign(document.createElement('details'), { className: 'lm' });
      d.innerHTML = `<summary>LearnableMeta maps<small>${lm.length} GeoGuessr map${lm.length > 1 ? 's' : ''} for ${nameOf(iso)}</small></summary><ul></ul>`;
      [...lm].sort((a, b) => order[a[1]] - order[b[1]] || a[3].localeCompare(b[3])).forEach(m => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="lv" title="${lvName[m[1]] || ''}">${m[1]}</span><a target="_blank" rel="noopener" href="https://www.geoguessr.com/maps/${m[0]}"></a><a class="ml" target="_blank" rel="noopener" href="https://learnablemeta.com/maps/${m[0]}">metas ↗</a>`;
        li.querySelector('a').textContent = m[3] + ' ↗';
        d.querySelector('ul').appendChild(li);
      });
      box.appendChild(d);
    }
    return box;
  }

  // Confusions croisées (tgm.confusions, écrites par les trainers sur ce navigateur) : les pays pris pour celui-ci, ou l'inverse
  function mixEl(iso) {
    if (!window.TGM || !TGM.confusions) return null;
    const pairs = TGM.confusions.pairs({ iso }).slice(0, 6);
    if (!pairs.length) return null;
    const s = Object.assign(document.createElement('section'), { className: 'mix' });
    s.innerHTML = `<h2>Mixed up with<a class="more" href="confusions.html#${iso.toLowerCase()}">all mix-ups →</a></h2>`;
    for (const p of pairs) {
      const other = p.a === iso ? p.b : p.a;
      const row = Object.assign(document.createElement('div'), { className: 'mix-row' });
      const b = Object.assign(document.createElement('button'), { className: 'mix-c', title: 'Open its page' });
      b.textContent = `${TGM.flag(other)} ${nameOf(other)}`;
      b.onclick = () => selectCountry(other);
      row.appendChild(b);
      row.appendChild(Object.assign(document.createElement('span'), { className: 'mix-n', textContent: `×${p.n}` }));
      const via = Object.assign(document.createElement('span'), { className: 'mix-via' });
      Object.entries(p.byApp).sort((x, y) => y[1] - x[1]).forEach(([app, n]) => {
        const href = TGM.confusions.link(app, iso), info = TGM.confusions.apps[app];
        const l = Object.assign(document.createElement(href ? 'a' : 'span'), { textContent: `${info ? info.name : app} ${n}` });
        if (href) Object.assign(l, { href, target: '_blank', rel: 'noopener', title: `Explore ${nameOf(iso)} in ${info.name}` });
        via.appendChild(l);
      });
      const cmp = Object.assign(document.createElement('a'), { className: 'mix-cmp', href: `compare.html#${iso.toLowerCase()}/${other.toLowerCase()}`,
        title: `${nameOf(iso)} and ${nameOf(other)} side by side`, textContent: '⚖' });
      row.appendChild(via); row.appendChild(cmp);
      s.appendChild(row);
    }
    return s;
  }

  // À compléter : pour chaque type, les pays courants (tiers 1 à 3, countries.json) couverts par une fiche ou un trainer.
  // Un clic sur une case liste les pays manquants ; un clic sur un pays ouvre sa fiche.
  let gapSel = null;
  function gapsEl() {
    if (!window.TGM) return null;
    const TIERS = [1, 2, 3];
    const byTier = Object.fromEntries(TIERS.map(t => [t, TGM.isos().filter(k => TGM.tier(k) === t)]));
    const covered = (iso, type) => cards.some(c => c.types.includes(type) && c.countries.includes(iso))
      || apps.some(a => a.types.includes(type) && a.countries.includes(iso));
    const rows = types.filter(t => t.key !== 'other');
    const s = document.createElement('section');
    const d = Object.assign(document.createElement('details'), { className: 'sub', open: !!gapSel });
    d.innerHTML = '<summary>To fill in<small>countries with no card and no trainer, by type</small></summary>';
    const tb = Object.assign(document.createElement('table'), { className: 'gaps' });
    tb.innerHTML = '<tr><th></th>' + TIERS.map(t => `<th>Tier ${t}<br><small>${TGM.tierNames[t].en.toLowerCase()}</small></th>`).join('') + '</tr>';
    const list = Object.assign(document.createElement('div'), { className: 'gaps-list' });
    const showList = () => {
      list.innerHTML = '';
      if (!gapSel) return;
      const [type, t] = gapSel, miss = byTier[t].filter(k => !covered(k, type)).sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
      list.innerHTML = `<p>${typeLabel[type]} · tier ${t}: ${miss.length ? miss.length + ' countries with nothing' : 'all covered'}</p>`;
      const m = Object.assign(document.createElement('div'), { className: 'members' });
      miss.forEach(iso => {
        const b = Object.assign(document.createElement('button'), { textContent: nameOf(iso), title: TGM.name(iso, 'fr') });
        b.onclick = () => selectCountry(iso);
        m.appendChild(b);
      });
      list.appendChild(m);
    };
    for (const ty of rows) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${ty.label}</td>`;
      for (const t of TIERS) {
        const n = byTier[t].length, k = byTier[t].filter(iso => covered(iso, ty.key)).length;
        const td = document.createElement('td');
        const b = Object.assign(document.createElement('button'), { textContent: `${k}/${n}`,
          className: (k === n ? 'full' : k < n / 3 ? 'low' : '') + (gapSel && gapSel[0] === ty.key && gapSel[1] === t ? ' on' : '') });
        b.onclick = () => {
          gapSel = gapSel && gapSel[0] === ty.key && gapSel[1] === t ? null : [ty.key, t];
          tb.querySelectorAll('button').forEach(x => x.classList.remove('on'));
          gapSel && b.classList.add('on');
          showList();
        };
        td.appendChild(b); tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
    d.appendChild(tb); d.appendChild(list); showList();
    s.appendChild(d);
    return s;
  }

  // Trainers (apps.json, injecté par build.py) : liens vers les outils, ouverts dans un nouvel onglet
  function trainersEl() {
    if (!apps.length) return null;
    const s = document.createElement('section');
    s.innerHTML = '<h2>Trainers</h2>';
    const box = Object.assign(document.createElement('div'), { className: 'apps' });
    const order = { live: 0, wip: 1 };
    [...apps].sort((a, b) => (order[a.status] - order[b.status]) || a.name.en.localeCompare(b.name.en, 'en')).forEach(a => {
      const l = Object.assign(document.createElement('a'), { className: 'app', href: a.url, target: '_blank', rel: 'noopener' });
      const where = a.scope === 'world' ? `${a.countries.length || 'all'} countries` : a.countries.map(nameOf).join(', ');
      const what = a.types.map(t => typeLabel[t]).join(', ');
      l.innerHTML = `<b></b><small></small>${a.status === 'wip' ? '<span class="wip">in progress</span>' : ''}`;
      l.querySelector('b').textContent = a.name.en;
      l.querySelector('small').textContent = `${what} · ${where}`;
      box.appendChild(l);
    });
    s.appendChild(box);
    return s;
  }

  function renderBoard() {
    const board = $('board');
    board.innerHTML = '';
    if (!$('app').classList.contains('board-mode')) return;
    visible = [];   // la navigation suit l'ordre de la planche
    const t = selectionTitle();
    if (!t) return;
    board.appendChild(header(t[0], t[1], [
      [state.country ? 'See the map' : 'See the coverage', () => { state.view = 'map'; update(); }],
      closeBtn(reset),
    ]));
    if (state.cluster) board.appendChild(membersEl());
    fillBoard(board);
  }

  // ---------- Visionneuse ----------
  const lb = $('lightbox'), stage = $('stage'), img = $('lbimg');
  let cur = null, view = { s: 1, x: 0, y: 0 }, lbDrag = null;
  const preload = {};
  const applyView = () => { img.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; };
  function fit() {
    const r = stage.getBoundingClientRect();
    const bottom = visible.length > 1 ? 150 : 80;
    const s = Math.min((r.width - 40) / cur.w, (r.height - bottom - 20) / cur.h, 3);
    view = { s, x: (r.width - cur.w * s) / 2, y: (r.height - bottom - cur.h * s) / 2 + 10 };
    applyView();
  }
  function paintInv() {
    const inv = isInv(cur);
    img.classList.toggle('inv', inv);
    img.classList.toggle('dim', !inv && dark && !!cur.light);
    img.style.background = inv ? 'var(--inv-bg)' : '#fff';
    $('lbinv').classList.toggle('on', inv);
  }
  function openLb(c, list) {
    if (list) visible = list;
    cur = c;
    $('lbmsg').textContent = '';
    img.src = enc(c.thumb);                  // déjà en cache : jamais l'image de la fiche précédente
    img.width = c.w; img.height = c.h;
    const full = preload[c.id] || (preload[c.id] = Object.assign(new Image(), { decoding: 'async', src: enc(c.file) }));
    const swap = () => { if (cur === c) img.src = full.src; };
    if (full.complete && full.naturalWidth) swap();
    else {
      full.addEventListener('load', swap, { once: true });
      full.addEventListener('error', () => { if (cur === c) $('lbmsg').textContent = 'Original not found: run build.cmd again'; }, { once: true });
    }
    const where = c.cluster ? clusters[c.cluster].label : c.world ? 'World' : c.countries.map(nameOf).join(', ');
    $('lbtitle').innerHTML = `${where}<small>${c.types.map(t => typeLabel[t]).join(', ')}${c.group ? ', ' + c.group : ''}${c.title ? ', ' + c.title : ''}${c.lowres ? ', low resolution' : ''}</small>`;
    // Provenance (sources.json, injecté par build.py) : qui l'a faite, d'après quoi, sous quelle licence
    if (c.src) {
      const s = Object.assign(document.createElement('span'), { className: 'src' });
      s.textContent = 'Source: ' + [c.src.by, c.src.from, c.src.licence].filter(Boolean).join(' · ');
      if (c.src.url) s.append(' · ', Object.assign(document.createElement('a'), { href: c.src.url, target: '_blank', rel: 'noopener', textContent: 'link ↗' }));
      $('lbtitle').appendChild(s);
    }
    const i = visible.indexOf(c);
    $('lbprev').disabled = i <= 0;
    $('lbnext').disabled = i < 0 || i >= visible.length - 1;
    for (const n of [visible[i - 1], visible[i + 1]]) {
      if (n && !preload[n.id]) { preload[n.id] = new Image(); preload[n.id].src = enc(n.file); }
    }
    paintInv();
    paintStrip();
    lb.classList.add('open');
    fit();
  }
  function paintStrip() {
    const strip = $('strip');
    strip.innerHTML = '';
    if (visible.length < 2) return;
    for (const v of visible) {
      const b = document.createElement('button');
      b.className = v === cur ? 'cur' : '';
      b.title = v.title || v.types.map(t => typeLabel[t]).join(', ');
      b.innerHTML = `<img src="${enc(v.thumb)}" class="${imgCls(v)}" alt="">`;
      b.onclick = () => openLb(v);
      strip.appendChild(b);
    }
    strip.querySelector('.cur')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  const closeLb = () => lb.classList.remove('open');
  const step = d => { const i = visible.indexOf(cur) + d; if (visible[i]) openLb(visible[i]); };
  function toggleInv() {
    if (!dark) { dark = true; store.set('dark', true); invOverride[cur.id] = true; }
    else invOverride[cur.id] = !isInv(cur);
    if (invOverride[cur.id] === cur.invert) delete invOverride[cur.id];
    store.set('inv', invOverride);
    paintInv();
    update();
  }
